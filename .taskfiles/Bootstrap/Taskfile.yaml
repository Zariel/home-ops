---
version: "3"
set: [errexit, nounset, pipefail]
tasks:
  katl:
    desc: Bootstrap the installed Katl cluster, then networking, DNS and Flux
    prompt: Bootstrap the installed Katl nodes and this checkout's GitOps configuration?
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: :katl:validate
      - task: :katl:identity
      - .taskfiles/Katl/scripts/katlctl context save --config katl/cluster.yaml
      - .taskfiles/Katl/scripts/katlctl cluster bootstrap --config katl/cluster.yaml --identity katl/.local/hollywoo-kubernetes.katlkey --init-node k8s-0 --kubeconfig-out kubeconfig.yaml --overwrite-kubeconfig
      - task: cluster

  cluster:
    desc: Bootstrap a provisioned cluster
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: networking
      - task: kubeconfig-vip
      - task: dns
      - task: crds
      - task: flux

  networking:
    desc: Install CNI
    cmds:
      - kustomize build --enable-helm --load-restrictor=LoadRestrictionsNone {{.KUBERNETES_DIR}}/bootstrap/cilium | kubectl apply --validate=false --server-side -f -
      - |
        set -euo pipefail
        for crd in \
          ciliumloadbalancerippools.cilium.io \
          ciliumbgpclusterconfigs.cilium.io \
          ciliumbgppeerconfigs.cilium.io \
          ciliumbgpadvertisements.cilium.io; do
          attempt=1
          until kubectl wait --for=condition=Established crd/${crd} --timeout=30s; do
            if [ $attempt -ge 12 ]; then
              echo "Timed out waiting for CRD ${crd} to become established"
              exit 1
            fi
            echo "CRD ${crd} not ready yet (attempt ${attempt}), retrying in 10s..."
            attempt=$((attempt+1))
            sleep 10
          done
        done
      - kubectl apply --validate=false --server-side -k {{.KUBERNETES_DIR}}/bootstrap/cilium-networks
      - kubectl wait --for=condition=Ready nodes --all --timeout=600s

      - kubectl wait --namespace kube-system --for=jsonpath='{.status.loadBalancer.ingress[0].ip}'=10.45.0.100 service/kube-vip --timeout=300s

  kubeconfig-vip:
    desc: Switch the bootstrap kubeconfig to the Cilium-advertised API endpoint
    cmds:
      - |
        # VIP allocation precedes route convergence; preserve the current endpoint until reachable.
        attempt=1
        until kubectl --server=https://k8s.cbannister.casa:6443 --request-timeout=5s get --raw=/readyz; do
          if [ "$attempt" -ge 30 ]; then
            echo "API VIP is not ready after 30 attempts; check Cilium BGP peering and routing to 10.45.0.100" >&2
            exit 1
          fi
          echo "API VIP not ready (attempt ${attempt}/30), retrying in 5s..."
          attempt=$((attempt+1))
          sleep 5
        done
      - kubectl config set-cluster hollywoo --server=https://k8s.cbannister.casa:6443

  dns:
    desc: Install CoreDNS
    cmds:
      - kustomize build --enable-helm --load-restrictor=LoadRestrictionsNone {{.KUBERNETES_DIR}}/bootstrap/coredns | kubectl apply --server-side -f -
      - kubectl rollout status deployment/coredns -n kube-system --timeout=300s

  crds:
    desc: Install CRDs required by Flux apps
    cmds:
      - kubectl apply --server-side -k {{.KUBERNETES_DIR}}/bootstrap/crds

  flux:
    desc: Bootstrap Flux GitOps
    dir: "{{.KUBERNETES_DIR}}/bootstrap/flux"
    cmds:
      - kubectl apply --server-side -k {{.KUBERNETES_DIR}}/bootstrap/flux

      - sops --decrypt sops-age.sops.yaml | kubectl apply --server-side -f -
      - sops --decrypt github-deploy-key.sops.yaml | kubectl apply --server-side -f -

      - kubectl apply --server-side -k {{.KUBERNETES_DIR}}/flux/config
      - task: cloudflared

  cloudflared:
    desc: Seed Cloudflared credentials from 1Password
    cmds:
      - kubectl wait --for=create clustersecretstore/onepassword --timeout=600s
      - kubectl wait --for=condition=Ready clustersecretstore/onepassword --timeout=600s
      - kubectl wait --for=create namespace/network --timeout=600s
      # Seed the ExternalSecret before Flux can render the DNS records that consume it.
      - kubectl apply --server-side -n network -f {{.KUBERNETES_DIR}}/apps/network/cloudflared/app/externalsecret.yaml
      - kubectl wait --for=condition=Ready externalsecret/cloudflared -n network --timeout=300s
      - kubectl wait --for=create kustomization/cloudflared -n network --timeout=600s
      - flux reconcile kustomization cloudflared -n network

  validate-bgp:
    desc: Validate BGP peering
    cmds:
      - kubectl exec -n kube-system daemonset/cilium -- cilium bgp peers
