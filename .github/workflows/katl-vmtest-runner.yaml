---
name: Katl VM-test runner image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - containers/katl-vmtest-runner/**
      - .github/workflows/katl-vmtest-runner.yaml
  push:
    branches: [main]
    paths:
      - containers/katl-vmtest-runner/**
      - .github/workflows/katl-vmtest-runner.yaml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Read image version
        id: version
        run: echo "tag=$(cat containers/katl-vmtest-runner/version)" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: containers/katl-vmtest-runner
          load: true
          tags: ghcr.io/zariel/katl-vmtest-runner:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check runner environment
        env:
          IMAGE: ghcr.io/zariel/katl-vmtest-runner:${{ steps.version.outputs.tag }}
        run: |
          sudo modprobe vhost_vsock
          sudo modprobe tun
          docker run --rm --interactive --privileged \
            --volume /var/lib/docker --volume /var/lib/libvirt \
            "$IMAGE" bash -s \
            < containers/katl-vmtest-runner/check.sh
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/zariel/katl-vmtest-runner:${{ steps.version.outputs.tag }}
        run: docker push "$IMAGE"
