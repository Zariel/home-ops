# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/pod_v1.json
apiVersion: v1
kind: Pod
metadata:
  name: kube-apiserver
spec:
  containers:
    - name: kube-apiserver
      env:
        - name: TZ
          value: Europe/London
      resources:
        requests:
          cpu: 1000m
          memory: 3Gi
        limits:
          cpu: 3000m
          memory: 4Gi
