# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/pod_v1.json
apiVersion: v1
kind: Pod
metadata:
  name: kube-scheduler
spec:
  containers:
    - name: kube-scheduler
      resources:
        requests:
          cpu: 200m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 256Mi
