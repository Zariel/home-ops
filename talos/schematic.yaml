---
customization:
  extraKernelArgs:
    - "-selinux"
    - init_on_alloc=0
    - init_on_free=0
    - intel_iommu=on
    - iommu=pt
    - mitigations=off
    - apparmor=0
    - security=none
    - talos.logging.kernel=udp://10.45.0.2:6002/
    - talos.auditd.disabled=1
  systemExtensions:
    officialExtensions:
      - siderolabs/i915
      - siderolabs/intel-ucode
      - siderolabs/mei
