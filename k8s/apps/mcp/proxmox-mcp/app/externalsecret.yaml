---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: proxmox-mcp-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PVE_TOKEN_ID
      remoteRef:
        key: proxmox-mcp
        property: PVE_TOKEN_ID
    - secretKey: PVE_TOKEN_SECRET
      remoteRef:
        key: proxmox-mcp
        property: PVE_TOKEN_SECRET
