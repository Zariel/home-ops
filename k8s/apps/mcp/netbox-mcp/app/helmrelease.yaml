---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: netbox-mcp
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      netbox-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/zariel/netbox-mcp
              tag: 0.1.1@sha256:f0443501db00e59d5b2ca40a8e0c8f69ebdb27c566406fa028a94b2d1998fdce
            ports:
              - name: http
                containerPort: 8000
            env:
              TZ: Europe/London
              NETBOX_URL: http://netbox.default.svc.cluster.local
              NETBOX_PUBLIC_URL: https://netbox.cbannister.xyz
              # Accept only requests that Envoy has authenticated.
              MCP_AUTH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-gateway-credential
                    key: token
            envFrom:
              - secretRef:
                  name: netbox-mcp-secret
            probes:
              liveness:
                enabled: true
                type: TCP
              readiness:
                enabled: true
                type: TCP
              startup:
                enabled: true
                type: TCP
                spec:
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: netbox-mcp
        ports:
          http:
            port: 80
            targetPort: http
