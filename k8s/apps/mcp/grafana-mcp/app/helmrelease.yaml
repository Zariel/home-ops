---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: grafana-mcp
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      grafana-mcp:
        containers:
          app:
            image:
              repository: docker.io/grafana/mcp-grafana
              tag: 2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
            command:
              - /app/mcp-grafana
            args:
              - --transport=streamable-http
              - --address=0.0.0.0:8000
              - --allowed-hosts=grafana-mcp.cbannister.xyz
              - --disable-write
              - --enabled-tools=search,dashboard,datasource,prometheus,loki,alerting
              - --usage-stats=disabled
            env:
              TZ: Europe/London
              # Envoy authenticates MCP callers. Grafana grants anonymous Viewer access.
              GRAFANA_URL: http://grafana-service.monitoring.svc.cluster.local:3000
            probes:
              liveness: &health
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
                    httpHeaders:
                      - name: Host
                        value: grafana-mcp.cbannister.xyz
              readiness: *health
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: grafana-mcp
        ports:
          http:
            port: 8000
    route:
      app:
        hostnames:
          - grafana-mcp.cbannister.xyz
        parentRefs:
          - name: internal-cbannister-xyz
            namespace: network
            kind: ListenerSet
            sectionName: https
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /mcp
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Authorization
                    - X-Grafana-Service-Account-Token
                    - X-Grafana-API-Key
                    - X-Grafana-Org-Id
                    - X-Grafana-URL
            backendRefs:
              - identifier: app
                port: http
