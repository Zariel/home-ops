---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: grafana-mcp
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      grafana-mcp:
        containers:
          app:
            image:
              repository: docker.io/grafana/mcp-grafana
              tag: 2.4.0@sha256:63d4501d3166c2b9242d8a2b5b7df8892c59c6c477be3a2a61bcf8a252671f31
            ports:
              - name: http
                containerPort: 8000
            command:
              - /app/mcp-grafana
            args:
              - --transport=streamable-http
              - --address=0.0.0.0:8000
              - --allowed-hosts=${APP}.cbannister.xyz
              - --disable-write
              - --enabled-tools=search,dashboard,datasource,prometheus,loki,alerting
              - --usage-stats=disabled
            env:
              TZ: Europe/London
              # Envoy authenticates MCP callers. Grafana grants anonymous Viewer access.
              GRAFANA_URL: http://grafana-service.monitoring.svc.cluster.local:3000
              # Accept only requests that Envoy has authenticated.
              MCP_GRAFANA_SERVER_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-gateway-credential
                    key: token
            probes:
              liveness: &health
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: http
                    httpHeaders:
                      - name: Host
                        value: ${APP}.cbannister.xyz
              readiness: *health
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: grafana-mcp
        ports:
          http:
            port: 80
            targetPort: http
