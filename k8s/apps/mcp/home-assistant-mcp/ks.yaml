---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant-mcp
  namespace: mcp
spec:
  components:
    - ../../../../components/volsync
    - ../../../../components/mcp-auth
  dependsOn:
    - name: onepassword-store
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
    - name: envoy-gateway-operator
      namespace: network
    - name: pocket-id-instance
      namespace: default
  interval: 1h
  path: ./k8s/apps/mcp/home-assistant-mcp/app
  postBuild:
    substitute:
      APP: home-assistant-mcp
      MCP_HOST: home-assistant-mcp.cbannister.xyz
      MCP_SCOPE: home-assistant:access
      MCP_DISPLAY_NAME: Home Assistant MCP
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_PUID: "999"
      VOLSYNC_PGID: "999"
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: mcp
  timeout: 5m
  wait: false
