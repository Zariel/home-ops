---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant-mcp
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      home-assistant-mcp:
        # Settings and tool policy have a single writer on an RWO volume.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/homeassistant-ai/ha-mcp
              tag: 9.3.0@sha256:8da893a58da84be7c6e2a8057dfac4fc74821bc5bf17676b5223e439e914db2b
            ports:
              - name: http
                containerPort: 8086
            command:
              - ha-mcp-web
            env:
              TZ: Europe/London
              HOMEASSISTANT_URL: http://home-assistant.default.svc.cluster.local:8123
              HOMEASSISTANT_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-mcp-secret
                    key: HOMEASSISTANT_TOKEN
              MCP_HOST: 0.0.0.0
              MCP_PORT: "8086"
              # Envoy validates Pocket ID tokens; clients share the HA account.
              MCP_SECRET_PATH: /mcp
              MCP_HEALTHZ: "true"
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /healthz
              readiness:
                enabled: true
                type: HTTP
                path: /healthz
              startup:
                enabled: true
                type: HTTP
                path: /healthz
                spec:
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: home-assistant-mcp
        ports:
          http:
            port: 80
            targetPort: http
    persistence:
      config:
        existingClaim: home-assistant-mcp
        globalMounts:
          - path: /home/mcpuser/.ha-mcp
      tmp:
        type: emptyDir
