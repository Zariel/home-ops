---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: home-assistant-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: home-assistant-mcp
      app.kubernetes.io/instance: home-assistant-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: home-assistant
            app.kubernetes.io/instance: home-assistant
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    # The standalone server checks PyPI and retrieves release notes on demand.
    - toFQDNs:
        - matchName: pypi.org
        - matchName: api.github.com
        - matchName: raw.githubusercontent.com
        - matchName: www.home-assistant.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
