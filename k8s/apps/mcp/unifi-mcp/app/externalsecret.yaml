---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unifi-mcp-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: UNIFI_NETWORK_USERNAME
      remoteRef:
        key: unifi-mcp
        property: UNIFI_NETWORK_USERNAME
    - secretKey: UNIFI_NETWORK_PASSWORD
      remoteRef:
        key: unifi-mcp
        property: UNIFI_NETWORK_PASSWORD
