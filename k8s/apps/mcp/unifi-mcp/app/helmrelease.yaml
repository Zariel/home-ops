---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: unifi-mcp
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      unifi-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/sirkirby/unifi-network-mcp
              tag: 0.50.4@sha256:faf447c22552ff97c25f194b32f74c0c28ca89dc45caa7b2de54c4ad8b2d692f
            ports:
              - name: http
                containerPort: 3000
            env:
              TZ: Europe/London
              PYTHONDONTWRITEBYTECODE: "1"
              HOME: /tmp
              UNIFI_NETWORK_HOST: unifi.cbannister.casa
              UNIFI_NETWORK_PORT: "443"
              UNIFI_NETWORK_VERIFY_SSL: "true"
              UNIFI_MCP_HTTP_ENABLED: "true"
              UNIFI_MCP_HTTP_TRANSPORT: streamable-http
              UNIFI_MCP_HOST: 0.0.0.0
              UNIFI_MCP_PORT: "3000"
              # Internal endpoint; Envoy validates Pocket ID access tokens.
              UNIFI_MCP_ALLOWED_HOSTS: localhost,127.0.0.1,${APP}.cbannister.xyz
              UNIFI_NETWORK_TOOL_PERMISSION_MODE: confirm
              # Allow Network writes while retaining the preview-and-confirm flow.
              UNIFI_POLICY_NETWORK_CREATE: "true"
              UNIFI_POLICY_NETWORK_UPDATE: "true"
              UNIFI_POLICY_NETWORK_DELETE: "true"
            envFrom:
              - secretRef:
                  name: unifi-mcp-secret
            probes:
              liveness:
                enabled: true
                type: TCP
              readiness:
                enabled: true
                type: TCP
              startup:
                enabled: true
                type: TCP
                spec:
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: unifi-mcp
        ports:
          http:
            port: 80
            targetPort: http
    persistence:
      tmp:
        type: emptyDir
