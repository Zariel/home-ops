---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unifi-mcp
  namespace: mcp
spec:
  components:
    - ../../../../components/mcp-auth
  dependsOn:
    - name: onepassword-store
      namespace: external-secrets
    - name: unifi-mcp-oidc
      namespace: mcp
    - name: envoy-gateway-operator
      namespace: network
  interval: 1h
  path: ./k8s/apps/mcp/unifi-mcp/app
  postBuild:
    substitute:
      APP: unifi-mcp
      MCP_HOST: unifi-mcp.cbannister.xyz
      MCP_PORT: "3000"
      MCP_SCOPE: unifi:access
      MCP_DISPLAY_NAME: UniFi Network MCP
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: mcp
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unifi-mcp-oidc
  namespace: mcp
spec:
  components:
    - ../../../../components/mcp-auth/oidc
  dependsOn:
    - name: pocket-id-instance
      namespace: default
  interval: 1h
  path: ./k8s/apps/mcp/unifi-mcp/oidc
  postBuild:
    substitute:
      APP: unifi-mcp
      MCP_HOST: unifi-mcp.cbannister.xyz
      MCP_SCOPE: unifi:access
      MCP_DISPLAY_NAME: UniFi Network MCP
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: mcp
  timeout: 5m
  wait: true
