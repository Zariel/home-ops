---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - helmrelease.yaml
  - networkpolicy.yaml
  - httproute.yaml
  - tcproute.yaml

# renovate: datasource=github-releases depName=catppuccin/gitea
# catppuccin-gitea: v1.0.2
configMapGenerator:
  - name: forgejo-catppuccin-theme
    files:
      - themes/theme-catppuccin-mocha-lavender.css

generatorOptions:
  disableNameSuffixHash: true
