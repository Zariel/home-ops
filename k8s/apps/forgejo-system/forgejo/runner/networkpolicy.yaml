---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-runner
  namespace: forgejo-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  ingress:
    # Jobs use the cache proxy; the internal cache server stays inaccessible.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: forgejo-runners
            app.kubernetes.io/managed-by: forgejo-runner
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
