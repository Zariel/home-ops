---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph-cluster
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v1.20.7
  url: oci://ghcr.io/rook/rook-ceph-cluster
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 1h
  timeout: 15m
  postRenderers:
    - kustomize:
        patches:
          # v1.20.4 exposes monitoring.metricsDisabled but does not render it
          # into the CephCluster. Ensure Rook keeps the broken mgr module off.
          # TODO: Once https://github.com/ceph/ceph/pull/71041 is merged and
          # included in the deployed Ceph release, remove this post-render patch
          # and monitoring.metricsDisabled below, then restore monitoring.enabled
          # and verify crash reports stay empty.
          - target:
              group: ceph.rook.io
              version: v1
              kind: CephCluster
              name: rook-ceph
            patch: |
              - op: add
                path: /spec/monitoring/metricsDisabled
                value: true
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    monitoring:
      enabled: false
      metricsDisabled: true
      createPrometheusRules: true
      prometheusRuleOverrides:
        CephNodeNetworkBondDegraded:
          disabled: true
        PrometheusJobExporterMissing:
          disabled: true
        PrometheusJobMissing:
          disabled: true
    toolbox:
      enabled: true
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v20.2.4
      allowUnsupported: false
    cephClusterSpec:
      resources:
        api:
          requests:
            cpu: 100m
          limits:
            memory: 512Mi
        mgr:
          requests:
            cpu: 500m
            memory: 768Mi
          limits:
            memory: 1Gi
        mon:
          requests:
            cpu: 500m
            memory: 768Mi
          limits:
            memory: 1Gi
        osd:
          requests:
            cpu: 1
            memory: 6Gi
          limits:
            memory: 10Gi
        mgr-sidecar:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
      # CSI must remain on AES until every node supports AES256K kernel mounts
      # (Linux 7.0+). Unmute these after CSI migration and cipher restriction.
      healthCheck:
        muteHealthWarning:
          AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
        daysToRetain: 14
      csi:
        readAffinity:
          enabled: true
          crushLocationLabels:
            - topology.kubernetes.io/zone
            - kubernetes.io/hostname
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      network:
        provider: host
        ipFamily: IPv4
        dualStack: false
        addressRanges:
          public:
            - 10.254.3.0/29
          cluster:
            - 10.254.3.0/29
        connections:
          compression:
            enabled: false
          requireMsgr2: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://vmsingle-victoria.monitoring.svc.cluster.local:8429
      storage:
        useAllNodes: false
        useAllDevices: false
        config:
          osdsPerDevice: "1"
        nodes:
          - name: k8s-0
            devices:
              - name: /dev/disk/by-id/nvme-eui.34333830522016980025384300000001
          - name: k8s-1
            devices:
              - name: /dev/disk/by-id/nvme-eui.34333830522015940025384300000001
          - name: k8s-2
            devices:
              - name: /dev/disk/by-id/nvme-eui.34333830522016880025384300000001
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: ["discard"]
          parameters:
            compression_mode: aggressive
            compression_algorithm: lz4
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems: []
    cephObjectStores:
      - name: ceph-objectstore
        spec:
          metadataPool:
            enableCrushUpdates: true
            failureDomain: host
            replicated:
              size: 3
          dataPool:
            enableCrushUpdates: true
            failureDomain: host
            erasureCoded:
              dataChunks: 2
              codingChunks: 1
            parameters:
              compression_algorithm: lz4
              compression_mode: aggressive
          gateway:
            instances: 2
            priorityClassName: system-cluster-critical
            port: 80
        storageClass:
          enabled: true
          name: ceph-bucket
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          annotations: {}
          labels: {}
          parameters:
            region: eu-west-1
            # endpoint: <hostname including port>
