---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.21.2
  url: oci://ghcr.io/rook/rook-ceph
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
  namespace: rook-ceph
spec:
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ceph-csi-controller-manager
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        env:
                          - name: TZ
                            value: Europe/London
            target:
              kind: Deployment
              name: ceph-csi-controller-manager
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: rook-ceph-operator
              spec:
                template:
                  spec:
                    containers:
                      - name: rook-ceph-operator
                        env:
                          - name: TZ
                            value: Europe/London
            target:
              kind: Deployment
              name: rook-ceph-operator
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    logLevel: DEBUG
    csi:
      installCsiOperator: true
      serviceMonitor:
        enabled: true
    enableDiscoveryDaemon: true
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    resources:
      requests:
        memory: 128Mi # unchangable
        cpu: 100m # unchangable
      limits: {}
