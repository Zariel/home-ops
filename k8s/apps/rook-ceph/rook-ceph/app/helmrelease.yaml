---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v1.20.5
  url: oci://ghcr.io/rook/rook-ceph
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
  namespace: rook-ceph
spec:
  interval: 1h
  timeout: 15m
  postRenderers:
    - kustomize:
        patches:
          # Kubernetes 1.36 validates int32 schema bounds on every write.
          # Rook v1.20.4 models these uint32 fields as int32, but keeps the
          # uint32 maximum. Match the upstream int64 fix until it is released.
          - target:
              group: apiextensions.k8s.io
              version: v1
              kind: CustomResourceDefinition
              name: cephclusters.ceph.rook.io
            patch: |
              - op: replace
                path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/security/properties/cephx/properties/csi/properties/keyGeneration/format
                value: int64
              - op: replace
                path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/security/properties/cephx/properties/daemon/properties/keyGeneration/format
                value: int64
              - op: replace
                path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/security/properties/cephx/properties/rbdMirrorPeer/properties/keyGeneration/format
                value: int64
          - target:
              group: apiextensions.k8s.io
              version: v1
              kind: CustomResourceDefinition
              name: cephclients.ceph.rook.io
            patch: |
              - op: replace
                path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/security/properties/cephx/properties/keyGeneration/format
                value: int64
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    logLevel: DEBUG
    csi:
      installCsiOperator: true
      serviceMonitor:
        enabled: true
    enableDiscoveryDaemon: true
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    resources:
      requests:
        memory: 128Mi # unchangable
        cpu: 100m # unchangable
      limits: {}
