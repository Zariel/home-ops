# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/service_v1.json
apiVersion: v1
kind: Service
metadata:
  name: bind
  annotations:
    io.cilium/lb-ipam-ips: 10.45.0.55
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: bind
  ports:
    - port: 53
      targetPort: 53
      protocol: UDP
      name: dns-udp
    - port: 53
      targetPort: 53
      protocol: TCP
      name: dns-tcp
