---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - pvc.yaml
  - service.yaml
  - service-primary.yaml
  - service-primary-internal.yaml
  - externalsecret.yaml
configMapGenerator:
  - name: bind-config
    files:
      - config/named-primary.conf
  - name: bind-zones
    files:
      - config/zones/db.cbannister.xyz
      - config/zones/db.rociobolanos.com
