---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pve-ipmi-certificate
spec:
  schedule: "17 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 420
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pve-ipmi-certificate
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: deploy
              image: docker.io/library/python:3.15.2-alpine3.24@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
              command: [python, -B, /config/deploy.py]
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: BMC_HOST
                  value: pve-ipmi.cbannister.casa
                - name: BMC_ADDRESS
                  value: 10.1.1.30
                - name: BMC_ALLOW_RESET
                  value: "false"
                - name: BMC_BOOTSTRAP_SHA256
                  value: 16cb30064b717c9a11a4e89cc1b6004eef6586b34f3c59a2baa2b3b84b73a5b4
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tls
                  mountPath: /tls
                  readOnly: true
                - name: credentials
                  mountPath: /credentials
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: pve-ipmi-deploy
            - name: tls
              secret:
                secretName: pve-ipmi-tls
                defaultMode: 0440
            - name: credentials
              secret:
                secretName: pve-ipmi-credentials
                defaultMode: 0440
