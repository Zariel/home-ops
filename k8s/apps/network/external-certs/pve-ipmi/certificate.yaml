---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pve-ipmi
spec:
  secretName: pve-ipmi-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: pve-ipmi.cbannister.casa
  dnsNames:
    - pve-ipmi.cbannister.casa
    - ipmi.pve.cbannister.casa
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS1
    rotationPolicy: Always
