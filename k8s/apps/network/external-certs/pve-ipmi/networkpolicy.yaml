---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pve-ipmi-certificate
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pve-ipmi-certificate
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - ipBlock:
            cidr: 10.1.1.30/32
      ports:
        - protocol: TCP
          port: 443
