---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pdu-certificate
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pdu-certificate
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - ipBlock:
            cidr: 10.1.0.31/32
      ports:
        - protocol: TCP
          port: 443
