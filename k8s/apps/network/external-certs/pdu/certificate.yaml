---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pdu
spec:
  secretName: pdu-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: pdu.cbannister.casa
  dnsNames:
    - pdu.cbannister.casa
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS1
    rotationPolicy: Always
