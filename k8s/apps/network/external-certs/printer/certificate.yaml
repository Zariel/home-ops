---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: printer
spec:
  secretName: printer-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: printer.cbannister.casa
  dnsNames:
    - printer.cbannister.casa
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS1
    rotationPolicy: Always
  keystores:
    pkcs12:
      create: true
      profile: Modern2023
      passwordSecretRef:
        name: printer-credentials
        key: password
