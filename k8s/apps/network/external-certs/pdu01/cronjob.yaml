---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pdu01-certificate
spec:
  schedule: "23 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 420
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pdu01-certificate
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: deploy
              image: docker.io/library/python:3.14.10-alpine3.24@sha256:a18b20ad69e74df6cf6d2e1b1a260d7a1ecf5380fd83b310f83ba88c461cf894
              command: [python, -B, /config/deploy.py]
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: PDU_HOST
                  value: pdu01.cbannister.casa
                - name: PDU_ADDRESS
                  value: 10.1.0.31
                - name: PDU_BOOTSTRAP_SHA256
                  value: 6a918dab59a434db097b04746c113c64c9f12508497d1b95065f8e373e3b14d2
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tls
                  mountPath: /tls
                  readOnly: true
                - name: credentials
                  mountPath: /credentials
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: pdu01-deploy
            - name: tls
              secret:
                secretName: pdu01-tls
                defaultMode: 0440
            - name: credentials
              secret:
                secretName: pdu01-credentials
                defaultMode: 0440
