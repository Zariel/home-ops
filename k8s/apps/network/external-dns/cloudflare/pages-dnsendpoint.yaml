---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: rbtherapy-pages
  namespace: network
  labels:
    # Publish the same target in Cloudflare and internal BIND.
    external-dns.home/visibility: shared
spec:
  endpoints:
    - dnsName: www.rociobolanos.com
      recordType: CNAME
      recordTTL: 300
      targets:
        - rbtherapy.pages.dev
