---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: external-dns-test
  namespace: network
  labels:
    # Cloudflare only; the BIND CRD instance publishes internal and shared.
    external-dns.home/visibility: external
spec:
  endpoints:
    - dnsName: external-dns-test.cbannister.xyz
      recordType: CNAME
      recordTTL: 60
      targets:
        - example.com
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
