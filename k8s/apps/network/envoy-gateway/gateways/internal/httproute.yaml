---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rociobolanos-apex-redirect
  namespace: network
spec:
  hostnames:
    - rociobolanos.com
  parentRefs:
    - name: internal-rociobolanos-com-apex
      namespace: network
      kind: ListenerSet
      sectionName: https
    - name: internal
      namespace: network
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: www.rociobolanos.com
            port: 443
            statusCode: 301

