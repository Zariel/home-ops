---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-external
spec:
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-name: external
      gateway.envoyproxy.io/owning-gateway-namespace: network
  ingress:
    # Listeners behind the external LoadBalancer, reached through cloudflared
    # and directly: HTTP, and HTTPS over TCP and QUIC.
    - fromEntities:
        - world
        - cluster
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
            - port: "10443"
              protocol: TCP
            - port: "10443"
              protocol: UDP
    # Envoy stats, the shutdown manager and readiness.
    - fromEntities:
        - host
      toPorts: &admin
        - ports:
            - port: "19001"
              protocol: TCP
            - port: "19002"
              protocol: TCP
            - port: "19003"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts: *admin
  egress:
    # Any namespace can attach routes to the external listener. A backend is
    # reachable only after its Service opts in, so attaching a route alone
    # cannot expose a workload to untrusted traffic.
    - toServices:
        - k8sServiceSelector:
            namespace: default
            selector:
              matchLabels:
                cbannister.xyz/external-backend: "true"
    # SecurityPolicy OIDC token exchange.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: pocket-id
      toPorts:
        - ports:
            - port: "1411"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            control-plane: envoy-gateway
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
