---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-operator
spec:
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: envoy-gateway
              spec:
                template:
                  spec:
                    containers:
                      - name: envoy-gateway
                        env:
                          - name: TZ
                            value: Europe/London
            target:
              kind: Deployment
              name: envoy-gateway
  interval: 1h
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: envoy-gateway-operator
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    global:
      imageRegistry: mirror.gcr.io
    deployment:
      priorityClassName: cluster-p2
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 128Mi
    config:
      envoyGateway:
        gateway:
          controllerName: gateway.envoyproxy.io/gatewayclass-controller
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace

