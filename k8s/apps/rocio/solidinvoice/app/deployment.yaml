---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solidinvoice
  namespace: rocio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: solidinvoice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solidinvoice
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: solidinvoice/solidinvoice:3.0.1@sha256:ae7c0e155cb5e515b49c83a4d2c003dc07d30b48952b6fd87b27e66e1d56b162
          env:
            - name: HOME
              value: /tmp
            - name: GOMEMLIMIT
              value: 1536MiB
            - name: TZ
              value: Europe/London
            - name: SOLIDINVOICE_CONFIG_DIR
              value: /etc/solidinvoice
            - name: SOLIDINVOICE_DATABASE_URL
              value: sqlite:////etc/solidinvoice/db/solidinvoice.db
            - name: SOLIDINVOICE_DISABLE_HTTPS
              value: "1"
            - name: SYMFONY_TRUSTED_PROXIES
              value: REMOTE_ADDR
            - name: SOLIDINVOICE_LOG_FORMAT
              value: json
          ports:
            - name: http
              containerPort: 8765
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /etc/solidinvoice
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: solidinvoice
