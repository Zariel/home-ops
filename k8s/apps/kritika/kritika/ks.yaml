apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kritika
spec:
  dependsOn:
    - name: kritika-database
      namespace: database
    - name: onepassword-store
      namespace: external-secrets
    - name: pocket-id-instance
      namespace: default
    - name: envoy-gateway-gateways
      namespace: network
  interval: 1h
  path: ./k8s/apps/kritika/kritika/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: kritika
  timeout: 8m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kritika
      namespace: kritika
