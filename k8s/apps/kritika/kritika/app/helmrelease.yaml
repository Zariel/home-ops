apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kritika
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.0.128
  url: oci://ghcr.io/home-operations/charts/kritika
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  interval: 1h
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: kritika
  postRenderers:
    - kustomize:
        patches:
          # The local server policy limits ingress and cluster egress.
          # The chart still owns the runner policies and admission rules.
          - patch: |-
              $patch: delete
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: kritika
                namespace: kritika
            target:
              kind: CiliumNetworkPolicy
              name: ^kritika$
  values:
    config:
      webUrl: https://kritika.cbannister.xyz
      auth:
        oidc:
          name: Pocket ID
          issuer: https://id.cbannister.xyz
          clientId: kritika
          clientSecret: {env: OIDC_CLIENT_SECRET}
          scopes: [openid, profile, email, groups]
          rolesClaim: groups
          roleMappingExpr: '"admin" in roles ? "admin" : ""'
      apps:
        github:
          accounts: [zariel]
          clientId: {env: GITHUB_APP_CLIENT_ID}
          privateKey: {env: GITHUB_APP_PRIVATE_KEY}
          webhookSecret: {env: GITHUB_APP_WEBHOOK_SECRET}
      providers:
        openai:
          type: openai
          apiKey: {env: OPENAI_API_KEY}
          pricing:
            gpt-5.4-mini:
              input: 0.75
              output: 4.50
              cacheRead: 0.075
      egress:
        # GHCR redirects OCI image config blobs to its package storage host.
        allow:
          - ghcr.io
          - pkg-containers.githubusercontent.com
      embedding:
        model: openai/text-embedding-3-small
        dims: 1536
      review:
        model: openai/gpt-5.4-mini
        # GPT-5.4 mini requires none for tools on Chat Completions.
        effort: "none"
      confidence:
        model: openai/gpt-5.4-mini
        effort: medium
        gate: false
      trigger:
        exclude:
          # Remove after review jobs have a sandboxed runtime.
          - name: waiting-for-runner-sandbox
            expr: "true"
    database:
      owner:
        existingSecret: kritika-owner
      app:
        existingSecret: kritika-app
    env:
      TZ: Europe/London
      OIDC_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: kritika-oidc
            key: client_secret
    envFrom:
      - secretRef:
          name: kritika-openai
      - secretRef:
          name: kritika-github
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    podLabels:
      cbannister.xyz/ingress: internal-gateway
      cbannister.xyz/egress: internet
      cbannister.xyz/egress-internal-gateway: "true"
    networkPolicy:
      type: cilium
    runner:
      podTemplate:
        spec:
          hostUsers: false
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 1Gi
          containers:
            - name: runner
              env:
                - name: TZ
                  value: Europe/London
    monitoring:
      serviceMonitor:
        enabled: true
