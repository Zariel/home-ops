apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-owner
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika_owner
        uri: postgres://kritika_owner:{{ .password }}@pg18vc-rw.database.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: kritika-owner
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-app
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika_app
        uri: postgres://kritika_app:{{ .password }}@pg18vc-rw.database.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
