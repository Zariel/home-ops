apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kritika
components:
  - ../../components/common
resources:
  - ./kritika/ks.yaml
patches:
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        labels:
          pod-security.kubernetes.io/enforce: restricted
