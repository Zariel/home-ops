---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v1.21.3
  url: oci://quay.io/jetstack/charts/cert-manager
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: cert-manager
              spec:
                template:
                  spec:
                    containers:
                      - name: cert-manager-controller
                        env:
                          - name: TZ
                            value: Europe/London
            target:
              kind: Deployment
              name: cert-manager
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: cert-manager-cainjector
              spec:
                template:
                  spec:
                    containers:
                      - name: cert-manager-cainjector
                        env:
                          - name: TZ
                            value: Europe/London
            target:
              kind: Deployment
              name: cert-manager-cainjector
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: cert-manager-webhook
              spec:
                template:
                  spec:
                    containers:
                      - name: cert-manager-webhook
                        env:
                          - name: TZ
                            value: Europe/London
            target:
              kind: Deployment
              name: cert-manager-webhook
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cert-manager
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    replicaCount: 2
    crds:
      enabled: true
    dns01RecursiveNameservers: https://1.1.1.1:443/dns-query,https://1.0.0.1:443/dns-query
    dns01RecursiveNameserversOnly: true
    resources:
      requests:
        memory: 160Mi
      limits:
        memory: 160Mi
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        prometheusInstance: monitoring
    webhook:
      replicaCount: 2
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 128Mi
    cainjector:
      replicaCount: 2
      resources:
        requests:
          memory: 160Mi
        limits:
          memory: 160Mi
