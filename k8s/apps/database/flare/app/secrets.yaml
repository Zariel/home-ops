---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: flare-db-password
spec:
  length: 48
  allowRepeat: true
  symbols: 0
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: flare-db
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: flare-db-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: flare-db
          property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flare-db
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: flare
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: flare-db
        property: password
