rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  - name: healthy replication and recent backup
    interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_streaming_replicas{namespace="database",pod="pg18vc-2"}'
        values: '2+0x30'
      - series: 'cnpg_pg_replication_in_recovery{namespace="database",pod="pg18vc-2"}'
        values: '0+0x30'
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database",pod="pg18vc-2"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresReplicationMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: PostgresBackupStale
        exp_alerts: []
  - name: disconnected replicas despite available instance metrics
    interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_streaming_replicas{namespace="database",pod="pg18vc-2"}'
        values: '0+0x10'
      - series: 'cnpg_pg_replication_in_recovery{namespace="database",pod="pg18vc-2"}'
        values: '0+0x10'
      - series: 'cnpg_pg_replication_streaming_replicas{namespace="database",pod="pg18vc-1"}'
        values: '2+0x10'
      - series: 'cnpg_pg_replication_in_recovery{namespace="database",pod="pg18vc-1"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: PostgresReplicationMissing
        exp_alerts: []
      - eval_time: 6m
        alertname: PostgresReplicationMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: database
            exp_annotations:
              summary: pg18vc has fewer than two connected replicas or no primary replication metrics.
  - name: missing metrics cannot appear healthy
    alert_rule_test:
      - eval_time: 20m
        alertname: PostgresReplicationMissing
        exp_alerts:
          - exp_labels:
              namespace: database
              severity: critical
            exp_annotations:
              summary: pg18vc has fewer than two connected replicas or no primary replication metrics.
      - eval_time: 20m
        alertname: PostgresBackupStale
        exp_alerts:
          - exp_labels:
              namespace: database
              severity: critical
            exp_annotations:
              summary: pg18vc has no successful Barman backup in the last 36 hours or its backup metrics are missing.
  - name: backup timestamp ages beyond daily schedule allowance
    interval: 1m
    input_series:
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database",pod="pg18vc-2"}'
        values: '1+0x2400'
    alert_rule_test:
      - eval_time: 35h
        alertname: PostgresBackupStale
        exp_alerts: []
      - eval_time: 37h
        alertname: PostgresBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: database
            exp_annotations:
              summary: pg18vc has no successful Barman backup in the last 36 hours or its backup metrics are missing.
