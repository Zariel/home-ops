apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kritika-password
spec:
  length: 48
  allowRepeat: true
  symbols: 0
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: kritika-owner
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: kritika-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: kritika-owner
          property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-owner
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika_owner
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: kritika-owner
        property: password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: kritika-app
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: kritika-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: kritika-app
          property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-app
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika_app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: kritika-app
        property: password
