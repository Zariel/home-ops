---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openebs-localpv-provisioner
  namespace: openebs-system
spec:
  endpointSelector:
    matchLabels:
      app: localpv-provisioner
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  # The API server listens on the node addresses. Cilium labels the local node
  # host, and other nodes remote-node or kube-apiserver.
  egress:
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
