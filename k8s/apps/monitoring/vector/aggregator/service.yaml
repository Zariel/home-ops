---
apiVersion: v1
kind: Service
metadata:
  name: vector-ingest
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: Stateless-Aggregator
    app.kubernetes.io/instance: vector-aggregator
    app.kubernetes.io/name: vector
  ports:
    - name: ingestion
      port: 6006
      targetPort: ingestion
      protocol: TCP
