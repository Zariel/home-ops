---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: prometheus-blackbox-exporter
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 11.21.1
  url: oci://ghcr.io/prometheus-community/charts/prometheus-blackbox-exporter
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: prometheus-blackbox-exporter
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: blackbox-exporter
    resources:
      requests:
        memory: 96Mi
      limits:
        memory: 96Mi
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        add: ["NET_RAW"]
    config:
      modules:
        dns-vip-local-udp:
          prober: dns
          timeout: 5s
          dns:
            transport_protocol: udp
            preferred_ip_protocol: ip4
            query_name: gateway.cbannister.casa
            query_type: A
            valid_rcodes: [NOERROR]
            validate_answer_rrs:
              fail_if_none_matches_regexp: ['.*\sA\s+10\.254\.254\.1$']
        dns-vip-local-tcp:
          prober: dns
          timeout: 5s
          dns:
            transport_protocol: tcp
            preferred_ip_protocol: ip4
            query_name: gateway.cbannister.casa
            query_type: A
            valid_rcodes: [NOERROR]
            validate_answer_rrs:
              fail_if_none_matches_regexp: ['.*\sA\s+10\.254\.254\.1$']
        dns-vip-upstream-udp:
          prober: dns
          timeout: 5s
          dns:
            transport_protocol: udp
            preferred_ip_protocol: ip4
            query_name: example.com
            query_type: A
            valid_rcodes: [NOERROR]
            validate_answer_rrs:
              fail_if_none_matches_regexp: ['.*\sA\s+.*']
        dns-vip-upstream-tcp:
          prober: dns
          timeout: 5s
          dns:
            transport_protocol: tcp
            preferred_ip_protocol: ip4
            query_name: example.com
            query_type: A
            valid_rcodes: [NOERROR]
            validate_answer_rrs:
              fail_if_none_matches_regexp: ['.*\sA\s+.*']
        dns-bind-udp:
          prober: dns
          timeout: 5s
          dns:
            transport_protocol: udp
            preferred_ip_protocol: ip4
            query_name: cbannister.xyz
            query_type: SOA
            valid_rcodes: [NOERROR]
            validate_answer_rrs:
              fail_if_none_matches_regexp: ['.*\sSOA\s+.*']
        dns-bind-tcp:
          prober: dns
          timeout: 5s
          dns:
            transport_protocol: tcp
            preferred_ip_protocol: ip4
            query_name: cbannister.xyz
            query_type: SOA
            valid_rcodes: [NOERROR]
            validate_answer_rrs:
              fail_if_none_matches_regexp: ['.*\sSOA\s+.*']
        dns-coredns-udp:
          prober: dns
          timeout: 5s
          dns:
            transport_protocol: udp
            preferred_ip_protocol: ip4
            query_name: kubernetes.default.svc.cluster.local
            query_type: A
            valid_rcodes: [NOERROR]
            validate_answer_rrs:
              fail_if_none_matches_regexp: ['.*\sA\s+172\.21\.0\.1$']
        dns-coredns-tcp:
          prober: dns
          timeout: 5s
          dns:
            transport_protocol: tcp
            preferred_ip_protocol: ip4
            query_name: kubernetes.default.svc.cluster.local
            query_type: A
            valid_rcodes: [NOERROR]
            validate_answer_rrs:
              fail_if_none_matches_regexp: ['.*\sA\s+172\.21\.0\.1$']
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            follow_redirects: true
            preferred_ip_protocol: ipv4
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ipv4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ipv4
    serviceMonitor:
      enabled: true
      defaults:
        interval: 1m
        scrapeTimeout: 10s
    prometheusRule:
      enabled: true
      rules:
        - alert: BlackboxProbeFailed
          expr: probe_success == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The host {{ $labels.instance }} is currently unreachable
