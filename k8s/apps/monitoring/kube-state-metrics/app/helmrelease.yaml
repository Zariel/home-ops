---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-state-metrics
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 9.0.1
  url: oci://ghcr.io/prometheus-community/charts/kube-state-metrics
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kube-state-metrics
spec:
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kube-state-metrics
              spec:
                template:
                  spec:
                    containers:
                      - name: kube-state-metrics
                        env:
                          - name: TZ
                            value: Europe/London
            target:
              kind: Deployment
              name: kube-state-metrics
  interval: 1h
  releaseName: *app
  chartRef:
    kind: OCIRepository
    name: *app
  dependsOn:
    - name: prometheus-operator-crds
      namespace: monitoring
  values:
    rbac:
      extraRules:
        - apiGroups: [kustomize.toolkit.fluxcd.io]
          resources: [kustomizations]
          verbs: [list, watch]
        - apiGroups: [helm.toolkit.fluxcd.io]
          resources: [helmreleases]
          verbs: [list, watch]
        - apiGroups: [source.toolkit.fluxcd.io]
          resources: [gitrepositories, ocirepositories, helmrepositories, helmcharts, buckets, externalartifacts]
          verbs: [list, watch]
    customResourceState:
      enabled: true
      config:
        spec:
          resources:
            - groupVersionKind:
                group: kustomize.toolkit.fluxcd.io
                version: v1
                kind: Kustomization
              metricNamePrefix: gotk
              metrics: &fluxMetrics
                - name: resource_info
                  help: Current readiness and suspension state of a Flux resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
            - groupVersionKind:
                group: helm.toolkit.fluxcd.io
                version: v2
                kind: HelmRelease
              metricNamePrefix: gotk
              metrics: *fluxMetrics
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: GitRepository
              metricNamePrefix: gotk
              metrics: *fluxMetrics
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: OCIRepository
              metricNamePrefix: gotk
              metrics: *fluxMetrics
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmRepository
              metricNamePrefix: gotk
              metrics: *fluxMetrics
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmChart
              metricNamePrefix: gotk
              metrics: *fluxMetrics
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: Bucket
              metricNamePrefix: gotk
              metrics: *fluxMetrics
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: ExternalArtifact
              metricNamePrefix: gotk
              metrics: *fluxMetrics
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 256Mi
    kubeRBACProxy:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 64Mi
    releaseLabel: true
    prometheus:
      monitor:
        enabled: true
        honorLabels: true
        relabelings:
          - action: replace
            regex: (.*)
            replacement: $1
            sourceLabels: ["__meta_kubernetes_pod_node_name"]
            targetLabel: kubernetes_node
