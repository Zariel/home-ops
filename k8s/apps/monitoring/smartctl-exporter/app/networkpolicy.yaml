---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: smartctl-exporter
spec:
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-smartctl-exporter
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts: &scrape
        - ports:
            - port: "9633"
              protocol: TCP
    # Kubelet probes.
    - fromEntities:
        - host
      toPorts: *scrape
  # The exporter reads local disks only.
  egress:
    - {}
