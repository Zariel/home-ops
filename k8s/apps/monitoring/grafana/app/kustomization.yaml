apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
labels:
  - pairs:
      app: grafana
resources:
  - externalsecret.yaml
  - grafana.yaml
  - grafanadatasource.yaml
  - grafanadashboard.yaml
  - servicemonitor.yaml
configurations:
  - kustomizeconfig.yaml
configMapGenerator:
  - name: zfs-better-dashboard
    files:
      - resources/dashboards/zfs-better.json
  - name: brocade-temperature-dashboard
    files:
      - resources/dashboards/brocade-temperature.json
  - name: raritan-pdu-dashboard
    files:
      - resources/dashboards/raritan-pdu.json
  - name: homelab-power-cpu-thermals-dashboard
    files:
      - resources/dashboards/homelab-power-cpu-thermals.json
