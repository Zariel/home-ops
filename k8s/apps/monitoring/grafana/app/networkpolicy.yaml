---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
spec:
  # Pod labels select the shared policies listed in k8s/README.md. Each
  # direction has its own rule, so removing a label cannot open the workload.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app: grafana
  ingress:
    - fromEndpoints:
        # Dashboards, datasources and folders are managed through the API.
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: grafana-operator
        - matchLabels:
            io.kubernetes.pod.namespace: mcp
            app.kubernetes.io/name: grafana-mcp
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    # Datasources from grafanadatasource.yaml.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmselect
      toPorts:
        - ports:
            - port: "8481"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vlsingle
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmalertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
