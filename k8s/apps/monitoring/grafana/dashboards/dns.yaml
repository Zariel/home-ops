---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: dns-overview
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 30m
  folder: DNS
  configMapRef:
    name: dns-dashboards
    key: dns-overview.json
