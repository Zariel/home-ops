apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: victoriametrics-cluster
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 30m
  folder: Monitoring
  grafanaCom:
    # renovate: depName="VictoriaMetrics - cluster"
    id: 11176
    revision: 64
  variables:
    - name: ds
      value: victoriametrics
