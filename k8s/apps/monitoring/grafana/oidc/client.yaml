# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: grafana
  namespace: monitoring
spec:
  name: Grafana
  clientID: grafana
  instanceSelector:
    matchLabels:
      pocketid.internal/instance: pocket-id
  pkceEnabled: true
  callbackUrls:
    - https://grafana.cbannister.xyz/login/generic_oauth
  launchUrl: https://grafana.cbannister.xyz
  allowedUserGroups:
    - groupName: admin
  secret:
    name: grafana-oidc
  logo:
    autoGenerate: false
