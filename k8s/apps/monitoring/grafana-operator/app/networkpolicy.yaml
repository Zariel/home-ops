---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-operator
spec:
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-operator
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # Cilium learns the dashboard hosts' addresses for the FQDN rule.
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # The operator configures Grafana through its API.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app: grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Dashboards fetched by grafanaCom ID or URL in GrafanaDashboard resources.
    - toFQDNs:
        - matchName: grafana.com
        - matchName: raw.githubusercontent.com
        - matchName: gitlab.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
