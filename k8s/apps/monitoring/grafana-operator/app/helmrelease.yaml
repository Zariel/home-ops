# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: monitoring
spec:
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: grafana-operator
              spec:
                template:
                  spec:
                    containers:
                      - name: grafana-operator
                        env:
                          - name: TZ
                            value: Europe/London
            target:
              kind: Deployment
              name: grafana-operator
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: grafana-operator
  values:
    crds:
      immutable: false
    dashboard:
      enabled: true
    serviceMonitor:
      enabled: true
