# yaml-language-server: $schema=https://crds.jank.ing/operator.victoriametrics.com/vmsingle_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: victoria
spec:
  useStrictSecurity: true
  retentionPeriod: "12"
  extraArgs:
    dedup.minScrapeInterval: 30s
    memory.allowedBytes: 2GiB
    maxLabelsPerTimeseries: "100"
    search.cacheTimestampOffset: 15m
    # Temporary export concurrency while VMCluster history is copied.
    search.maxConcurrentRequests: "8"
    search.maxMemoryPerQuery: 256MiB
    search.minStalenessInterval: 5m
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: vmsingle
  resources:
    requests:
      cpu: 1
      memory: 8Gi
    limits:
      memory: 16Gi
