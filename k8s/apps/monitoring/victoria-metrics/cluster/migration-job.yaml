---
apiVersion: v1
kind: Service
metadata:
  name: vminsert-victoria-import
  namespace: monitoring
spec:
  # Each temporary importer uses the insert pod on its own node.
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: vminsert
    app.kubernetes.io/instance: victoria
  ports:
    - name: http
      port: 8480
      targetPort: 8480
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vmsingle-to-vmcluster-20261027-early
  namespace: monitoring
spec:
  suspend: false
  backoffLimit: 3
  activeDeadlineSeconds: 86400
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-0
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmctl
          image: victoriametrics/vmctl:v1.155.0
          args:
            - vm-native
            - -s
            - --disable-progress-bar
            - --vm-native-src-addr=http://vmsingle-victoria.monitoring.svc:8429
            - --vm-native-dst-addr=http://vminsert-victoria-import.monitoring.svc:8480/insert/0/prometheus
            - --vm-native-filter-match={__name__!=""}
            # Both source data directories contain only these two months.
            - --vm-native-filter-time-start=2026-09-01T00:00:00Z
            # Overlap with dual writes to avoid a gap at the boundary.
            - --vm-native-filter-time-end=2026-10-10T00:00:00Z
            - --vm-native-step-interval=day
            - --vm-native-disable-per-metric-migration
            - --vm-concurrency=2
            - --vm-rate-limit=67108864
            - --pushmetrics.url=http://vmagent-victoria.monitoring.svc:8429/api/v1/import/prometheus
            - --pushmetrics.extraLabel=job="vmcluster-migration",shard="early"
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vmsingle-to-vmcluster-20261027-late
  namespace: monitoring
spec:
  suspend: false
  backoffLimit: 3
  activeDeadlineSeconds: 86400
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-1
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmctl
          image: victoriametrics/vmctl:v1.155.0
          args:
            - vm-native
            - -s
            - --disable-progress-bar
            - --vm-native-src-addr=http://vmsingle-victoria.monitoring.svc:8429
            - --vm-native-dst-addr=http://vminsert-victoria-import.monitoring.svc:8480/insert/0/prometheus
            - --vm-native-filter-match={__name__!=""}
            # Both source data directories contain only these two months.
            - --vm-native-filter-time-start=2026-10-10T00:00:00Z
            # Overlap with dual writes to avoid a gap at the boundary.
            - --vm-native-filter-time-end=2026-10-27T22:51:00Z
            - --vm-native-step-interval=day
            - --vm-native-disable-per-metric-migration
            - --vm-concurrency=2
            - --vm-rate-limit=67108864
            - --pushmetrics.url=http://vmagent-victoria.monitoring.svc:8429/api/v1/import/prometheus
            - --pushmetrics.extraLabel=job="vmcluster-migration",shard="late"
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
