---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmstorage
spec:
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmstorage
      app.kubernetes.io/instance: victoria
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vminsert
      toPorts:
        - ports:
            - port: "8400"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmselect
      toPorts:
        - ports:
            - port: "8401"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts: &http
        - ports:
            - port: "8482"
              protocol: TCP
    - fromEntities:
        - host
      toPorts: *http
  egress:
    - {}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vminsert
spec:
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vminsert
      app.kubernetes.io/instance: victoria
  ingress:
    # vmagent remote-writes samples and scrapes vminsert's own metrics.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts: &http
        - ports:
            - port: "8480"
              protocol: TCP
    - fromEntities:
        - host
      toPorts: *http
  egress:
    # The vmstorage nodes are addressed by their headless Service names.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmstorage
            app.kubernetes.io/instance: victoria
      toPorts:
        - ports:
            - port: "8400"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmselect
spec:
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmselect
      app.kubernetes.io/instance: victoria
  ingress:
    # Query clients: vmalert's rules, Grafana's datasource, and vmagent's scrape
    # of vmselect's own metrics.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - vmagent
                - vmalert
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app: grafana
      toPorts: &http
        - ports:
            - port: "8481"
              protocol: TCP
    # Kubelet probes and the Ceph dashboard, whose host-networked manager pods
    # query Prometheus through vmselect.
    - fromEntities:
        - host
        - remote-node
      toPorts: *http
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmstorage
            app.kubernetes.io/instance: victoria
      toPorts:
        - ports:
            - port: "8401"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmalert
spec:
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmalert
      app.kubernetes.io/instance: victoria
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts: &http
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8435"
              protocol: TCP
    - fromEntities:
        - host
      toPorts: *http
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Rule queries and state restore.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmselect
            app.kubernetes.io/instance: victoria
      toPorts:
        - ports:
            - port: "8481"
              protocol: TCP
    # Recording rule results and alert state are remote-written through vmagent.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8429"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmalertmanager
            app.kubernetes.io/instance: alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vlsingle
spec:
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vlsingle
      app.kubernetes.io/instance: vlogs
  ingress:
    # The Vector aggregator writes logs, Grafana queries them, and vmagent
    # scrapes VictoriaLogs' own metrics.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vector
            app.kubernetes.io/instance: vector-aggregator
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app: grafana
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts: &http
        - ports:
            - port: "9428"
              protocol: TCP
    - fromEntities:
        - host
      toPorts: *http
  egress:
    - {}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmagent
spec:
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmagent
      app.kubernetes.io/instance: victoria
  ingress:
    # vmalert remote-writes rule results; the replicas scrape each other.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - vmagent
                - vmalert
      toPorts: &http
        - ports:
            - port: "8429"
              protocol: TCP
            - port: "8435"
              protocol: TCP
    - fromEntities:
        - host
      toPorts: *http
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # Cilium learns LAN exporter addresses for the FQDN rule from DNS.
          rules:
            dns:
              - matchPattern: "*"
    # Scrape targets in every namespace and on the nodes, service discovery
    # through the API server, and remote write to vminsert.
    - toEntities:
        - cluster
    # The DNS VMs' exporters, scraped by address.
    - toCIDR:
        - 10.254.53.0/32
        - 10.254.53.2/32
        - 10.254.53.4/32
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
            - port: "5383"
              protocol: TCP
    # Node, SMART and Proxmox exporters on LAN hosts, scraped by name.
    - toFQDNs:
        - matchPattern: "*.cbannister.casa"
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
            - port: "9290"
              protocol: TCP
            - port: "9633"
              protocol: TCP
