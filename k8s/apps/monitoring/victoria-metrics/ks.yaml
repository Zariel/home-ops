---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app victoria-metrics-cluster
spec:
  path: ./k8s/apps/monitoring/victoria-metrics/cluster
  targetNamespace: monitoring
  components:
    - ../../../../components/volsync
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  dependsOn:
    - name: alertmanager
    - name: victoria-metrics-k8s-stack
    - name: onepassword-store
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
  postBuild:
    substitute:
      APP: vmsingle
      VOLSYNC_CAPACITY: 150Gi
      VOLSYNC_CACHE_CAPACITY: 10Gi
      VOLSYNC_PUID: "65534"
      VOLSYNC_PGID: "65534"
  patches:
    # The migrated claim is bound without a restore source; only new claims can set it.
    - target:
        kind: PersistentVolumeClaim
      patch: |-
        - op: add
          path: /metadata/annotations
          value:
            kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 15m
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app victoria-metrics-k8s-stack
spec:
  path: ./k8s/apps/monitoring/victoria-metrics/k8s-stack
  targetNamespace: monitoring
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: false
  interval: 1h
  retryInterval: 1m
  timeout: 15m
