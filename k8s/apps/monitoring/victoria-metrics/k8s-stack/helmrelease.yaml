---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-metrics-k8s-stack
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.98.1
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: victoria-metrics-k8s-stack-victoria-metrics-operator
              spec:
                template:
                  spec:
                    containers:
                      - name: operator
                        env:
                          - name: TZ
                            value: Europe/London
            target:
              kind: Deployment
              name: victoria-metrics-k8s-stack-victoria-metrics-operator
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  values:
    # Create default monitoring rules
    defaultRules:
      create: true
      sources:
        # Node-exporter runs in a separate HelmRelease.
        node-exporter:
          enabled: true
      rules:
        NodeBondingDegraded:
          # A single link-up member is sufficient for the current bond topology.
          enabled: false
        TargetDown:
          spec:
            # On-demand node exporters are intentionally unavailable while powered off.
            expr: up{availability!="on-demand"} == 0
            for: 10m
            annotations:
              summary: Scrape target is down
              description: >-
                Target {{ $labels.instance }} in job {{ $labels.job }} has been
                unreachable for at least 10 minutes.

    # Enable Grafana dashboards
    defaultDashboards:
      enabled: true

    # Create ServiceMonitors for kubeApiServer, kubeScheduler, kubeControllerManager, kubeEtcd
    kubeApiServer:
      enabled: true
      serviceMonitor:
        enabled: true

    kubeScheduler:
      enabled: true
      service:
        enabled: true
        labels:
          jobLabel: kube-scheduler
        selector:
          component: kube-scheduler
      vmScrape:
        spec:
          jobLabel: jobLabel
          namespaceSelector:
            matchNames: [kube-system]
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecureSkipVerify: true

    kubeControllerManager:
      enabled: true
      service:
        enabled: true
        labels:
          jobLabel: kube-controller-manager
        selector:
          component: kube-controller-manager
      vmScrape:
        spec:
          jobLabel: jobLabel
          namespaceSelector:
            matchNames: [kube-system]
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecureSkipVerify: true

    kubeEtcd:
      enabled: true
      endpoints:
        - 10.254.1.1
        - 10.254.1.3
        - 10.254.1.5
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          jobLabel: jobLabel
          namespaceSelector:
            matchNames: [kube-system]
          endpoints:
            - port: http-metrics
              scheme: http

    kubelet:
      enabled: true
      serviceMonitor:
        enabled: true
      vmScrape:
        spec:
          relabelConfigs:
            - sourceLabels: [__meta_kubernetes_node_name]
              targetLabel: node
            - sourceLabels: [__meta_kubernetes_node_label_kubernetes_io_hostname]
              targetLabel: kubernetes_io_hostname
            - sourceLabels: [__meta_kubernetes_node_label_topology_kubernetes_io_region]
              targetLabel: topology_kubernetes_io_region
            - sourceLabels: [__meta_kubernetes_node_label_topology_kubernetes_io_zone]
              targetLabel: topology_kubernetes_io_zone
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
            - targetLabel: job
              replacement: kubelet

    # Disable all Victoria Metrics components to avoid conflicts with existing setup
    vmsingle:
      enabled: false

    vmcluster:
      enabled: false

    vmagent:
      enabled: false

    vmalert:
      enabled: false

    alertmanager:
      enabled: false

    grafana:
      enabled: false

    vmauth:
      enabled: false

    # Disable exporters since you may have them separately
    prometheus-node-exporter:
      enabled: false

    kube-state-metrics:
      enabled: false

    victoria-metrics-operator:
      enabled: true
      operator:
        # Garbage-collect converted resources when their Prometheus source is removed.
        enable_converter_ownership: true
      resources:
        requests:
          memory: 224Mi
        limits:
          memory: 224Mi

    victoria-metrics-operator-crds:
      enabled: true
