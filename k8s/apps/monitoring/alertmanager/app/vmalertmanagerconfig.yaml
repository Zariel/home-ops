---
# yaml-language-server: $schema=https://crds.jank.ing/operator.victoriametrics.com/vmalertmanagerconfig_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: pushover
  labels:
    monitoring.cbannister.xyz/alertmanager-config: primary
spec:
  inhibit_rules:
    - source_matchers:
        - alertname = "InfoInhibitor"
      target_matchers:
        - severity = "info"
      equal:
        - namespace
  route:
    receiver: pushover
    group_by:
      - alertname
      - namespace
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - receiver: healthchecks
        matchers:
          - alertname = "Watchdog"
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 1m
      - receiver: blackhole
        matchers:
          - alertname = "InfoInhibitor"
  receivers:
    - name: blackhole
    - name: healthchecks
      webhook_configs:
        - send_resolved: false
          url_secret:
            name: alertmanager
            key: HEALTHCHECK_ENDPOINT
    - name: pushover
      pushover_configs:
        - send_resolved: true
          priority: "0"
          token:
            name: alertmanager
            key: PUSHOVER_API_KEY
          user_key:
            name: alertmanager
            key: PUSHOVER_USER_KEY
