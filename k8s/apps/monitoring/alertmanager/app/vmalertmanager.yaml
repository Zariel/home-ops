---
# yaml-language-server: $schema=https://crds.jank.ing/operator.victoriametrics.com/vmalertmanager_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: alertmanager
  labels:
    monitoring.cbannister.xyz/alertmanager: primary
spec:
  replicaCount: 2
  image:
    repository: quay.io/prometheus/alertmanager
    tag: v0.34.0
    pullPolicy: IfNotPresent
  externalURL: https://alertmanager.cbannister.xyz
  configSelector:
    matchLabels:
      monitoring.cbannister.xyz/alertmanager-config: primary
  disableNamespaceMatcher: true
  retention: 120h
  minReadySeconds: 30
  useStrictSecurity: true
  disableAutomountServiceAccountToken: true
  resources:
    requests:
      memory: 96Mi
    limits:
      memory: 96Mi
  configReloaderResources:
    requests:
      memory: 64Mi
    limits:
      memory: 64Mi
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: ceph-block
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
  podDisruptionBudget:
    maxUnavailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow
  serviceSpec:
    metadata:
      name: alertmanager-ha
    spec:
      type: ClusterIP
      ports:
        - name: web
          port: 9093
          targetPort: web
  serviceScrapeSpec:
    endpoints:
      - port: web
        interval: 30s
