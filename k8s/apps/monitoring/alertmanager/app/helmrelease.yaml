---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: alertmanager
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.42.0
  url: oci://ghcr.io/prometheus-community/charts/alertmanager
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app alertmanager
spec:
  interval: 1h
  releaseName: *app
  chartRef:
    kind: OCIRepository
    name: *app
  dependsOn:
    - name: prometheus-operator-crds
      namespace: monitoring
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    config:
      route:
        receiver: pushover
        group_by:
          - alertname
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
      receivers:
        - name: pushover
          pushover_configs:
            - send_resolved: true
              priority: "0"
              token_file: /etc/alertmanager/secrets/pushover/API_KEY
              user_key_file: /etc/alertmanager/secrets/pushover/USER_KEY
    extraSecretMounts:
      - name: pushover
        mountPath: /etc/alertmanager/secrets/pushover
        secretName: alertmanager-pushover
        readOnly: true
        subPath: ""
    resources:
      requests:
        memory: 96Mi
      limits:
        memory: 96Mi
    configmapReload:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 64Mi
    route:
      main:
        enabled: true
        hostnames:
          - "alertmanager.cbannister.xyz"
        parentRefs:
          - name: internal-cbannister-xyz
            namespace: network
            kind: ListenerSet
            sectionName: https
    podSecurityContext:
      fsGroup: 568
    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsUser: 568
      runAsNonRoot: true
      runAsGroup: 568
    replicaCount: 2
    podDisruptionBudget:
      maxUnavailable: 1
    baseURL: "https://alertmanager.cbannister.xyz"
    persistence:
      storageClass: ceph-block
      accessModes: ["ReadWriteOnce"]
      size: 1Gi
