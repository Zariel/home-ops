---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: noise-efivars
spec:
  matchers:
    - name: alertname
      value: NodeFilesystemAlmostOutOfSpace
    - name: fstype
      value: efivarfs
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: noise-kubeproxy
spec:
  matchers:
    - name: alertname
      value: KubeProxyDown
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: noise-ceph-mtu-external
spec:
  matchers:
    - name: alertname
      value: CephNodeInconsistentMTU
    - name: kubernetes_node
      value: ""
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: noise-tqm-failed-job
spec:
  matchers:
    - name: alertname
      value: KubeJobFailed
    - matchType: =~
      name: job_name
      value: tqm-.*
