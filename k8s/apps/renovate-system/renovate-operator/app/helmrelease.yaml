---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
  namespace: renovate-system
spec:
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: renovate-operator
              spec:
                template:
                  spec:
                    containers:
                      - name: renovate-operator
                        env:
                          - name: TZ
                            value: Europe/London
            target:
              kind: Deployment
              name: renovate-operator
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  values:
    fullnameOverride: renovate-operator
    crd:
      mode: template
    rbac:
      ownNamespaceOnly: true
    route:
      enabled: true
      hostnames:
        - renovate.cbannister.xyz
      parentRefs:
        - name: internal-cbannister-xyz
          namespace: network
          kind: ListenerSet
          sectionName: https
    policy:
      enabled: true
      allowedHosts:
        - api.github.com
        - github.com
        - git.cbannister.xyz
      allowedServiceAccounts:
        - renovate-runner
    config:
      globalParallelismLimit: 2
      defaultJobActiveDeadlineSeconds: 1800
      jobTTLSecondsAfterFinished: 86400
      logStorage:
        mode: memory
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
