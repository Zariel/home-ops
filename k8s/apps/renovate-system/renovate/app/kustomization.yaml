---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: renovate-system
resources:
  - externalsecret.yaml
  - serviceaccount.yaml
  - networkpolicy.yaml
  - template.yaml
  - github.yaml
  - forgejo.yaml
configMapGenerator:
  - name: renovate-env
    literals:
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
      - RENOVATE_INTERNAL_CHECKS_FILTER=strict
generatorOptions:
  disableNameSuffixHash: true
