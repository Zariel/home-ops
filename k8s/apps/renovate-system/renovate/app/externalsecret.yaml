---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
  namespace: renovate-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  data:
    - secretKey: private-key
      remoteRef:
        key: renovate
        property: GITHUB_BOT_PRIVATE_KEY
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: renovate-github-token
  namespace: renovate-system
spec:
  appID: "869136"
  installID: "49294101"
  repositories:
    - home-ops
  auth:
    privateKey:
      secretRef:
        name: renovate-github-app
        key: private-key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-token
  namespace: renovate-system
spec:
  # Refresh before discovery and executor Jobs can outlive installation tokens.
  refreshInterval: 15m
  target:
    template:
      data:
        RENOVATE_TOKEN: "{{ .token }}"
        GITHUB_COM_TOKEN: "{{ .token }}"
        GITHUB_COM_USER: horsey-bot[bot]
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: renovate-github-token
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-forgejo-token
  namespace: renovate-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: renovate
        property: FOREJO_TOKEN
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-registry-auth
  namespace: renovate-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        RENOVATE_HOST_RULES: |
          [
            {
              "hostType": "docker",
              "matchHost": "https://git.cbannister.xyz/",
              "allowInternal": true,
              "username": {{ .USERNAME | toJson }},
              "password": {{ .IMAGE_PULL_SECRET | toJson }}
            },
            {"matchHost": "https://git.cbannister.xyz/", "allowInternal": true},
            {"matchHost": "https://registry.cbannister.xyz/", "allowInternal": true}
          ]
  dataFrom:
    - extract:
        key: forgejo-image-pull
