---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJobTemplate
metadata:
  name: renovate
  namespace: renovate-system
spec:
  image: ghcr.io/renovatebot/renovate:44.178.5-full
  parallelism: 1
  serviceAccount:
    name: renovate-runner
    automountServiceAccountToken: false
  metadata:
    labels:
      app.kubernetes.io/name: renovate
  extraEnvFrom:
    - configMapRef:
        name: renovate-env
    - secretRef:
        name: renovate-registry-auth
  securityContext:
    # Match the image user so Nix can resolve and use its home directory.
    pod:
      runAsUser: 12021
      runAsGroup: 12021
      fsGroup: 12021
    container:
      runAsUser: 12021
      runAsGroup: 12021
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 4Gi
