---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-github
  namespace: renovate-system
spec:
  templateRef:
    name: renovate
  schedule: "CRON_TZ=Europe/London 19,49 * * * *"
  provider:
    name: github
  discoveryFilters:
    - Zariel/home-ops
  secretRef: renovate-github-token
  renovateConfig:
    fileName: config.json
    inline: |
      {
        "platformCommit": "enabled",
        "platformAutomerge": false,
        "allowedCommands": [
          "^\\.renovate/scripts/update-catppuccin-gitea\\.sh$",
          "^nix --extra-experimental-features 'nix-command flakes' flake update katl$"
        ]
      }
