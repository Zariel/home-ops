# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidinstance_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocket-id
  namespace: default
  labels:
    pocketid.internal/instance: pocket-id
spec:
  # Flux owns the workload and storage; the operator manages API resources only.
  external:
    url: https://id.cbannister.xyz
    apiKeySecretRef:
      name: pocket-id-operator-api
      key: token
