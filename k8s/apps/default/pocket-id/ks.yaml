---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pocket-id
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cert-manager-issuers
      namespace: cert-manager
    - name: cluster-ca-bundle
      namespace: cert-manager
    - name: onepassword-store
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
  components:
    - ../../../../components/volsync
  interval: 1h
  postBuild:
    substitute:
      APP: *app
  path: ./k8s/apps/default/pocket-id/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: pocket-id
      namespace: *namespace
    - apiVersion: apps/v1
      kind: Deployment
      name: pocket-id
      namespace: *namespace
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pocket-id-instance
  namespace: default
spec:
  dependsOn:
    - name: pocket-id-operator
    - name: pocket-id
  interval: 1h
  path: ./k8s/apps/default/pocket-id/instance
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: default
  timeout: 5m
  wait: true
