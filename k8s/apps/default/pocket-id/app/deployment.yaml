apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  namespace: default
spec:
  replicas: 1
  # SQLite must have a single writer, including during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocket-id
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/pocket-id/pocket-id:v2.19.1
          env:
            - name: STATIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pocket-id-operator-api
                  key: token
            - name: APP_URL
              value: https://id.cbannister.xyz
            - name: TRUST_PROXY
              value: 172.20.0.0/16
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pocket-id
                  key: ENCRYPTION_KEY
          ports:
            - name: http
              containerPort: 1411
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocket-id
