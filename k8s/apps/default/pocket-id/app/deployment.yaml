# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  namespace: default
  annotations:
    secret.reloader.stakater.com/reload: pocket-id-tls
spec:
  replicas: 1
  # SQLite must have a single writer, including during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocket-id
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/pocket-id/pocket-id:v2.19.3
          env:
            - name: TZ
              value: Europe/London
            - name: STATIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pocket-id-operator-api
                  key: token
            - name: APP_URL
              value: https://id.cbannister.xyz
            - name: TLS_CERT_FILE
              value: /etc/pocket-id/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/pocket-id/tls/tls.key
            - name: TRUST_PROXY
              value: 172.20.0.0/16
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pocket-id
                  key: ENCRYPTION_KEY
          ports:
            - name: https
              containerPort: 1411
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tls
              mountPath: /etc/pocket-id/tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocket-id
        - name: tls
          secret:
            secretName: pocket-id-tls
            defaultMode: 0440
