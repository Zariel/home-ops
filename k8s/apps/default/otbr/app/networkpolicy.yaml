---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otbr
  namespace: default
spec:
  # Pod labels select the shared policies listed in k8s/README.md. Each
  # direction has its own rule, so removing a label cannot open the workload.
  # Thread traffic uses the Multus interface, which Cilium does not enforce.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: otbr
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: home-assistant
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - {}
    # The mdns-unicast-relay sidecar delivers the border agent's records.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: home-assistant
      toPorts:
        - ports:
            - port: "5353"
              protocol: UDP
