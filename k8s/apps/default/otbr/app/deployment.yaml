apiVersion: apps/v1
kind: Deployment
metadata:
  name: otbr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: otbr
  template:
    metadata:
      labels:
        app: otbr
        app.kubernetes.io/name: otbr
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot",
            "namespace": "kube-system",
            "ips": ["10.1.3.121/24", "fd74:f571:d3bd:40:41d7:bb2e:6c90:a8f5/64"],
            "mac": "0a:92:17:bd:44:6e"
          }]
    spec:
      hostname: otbr
      containers:
        - name: otbr
          image: openthread/border-router:v2026.07.0@sha256:611b28c77cdff41279cbb5b29d0a41fcdc5a1ecb402a2b19bde1b8f5f7c6c912
          env:
            - name: OT_RCP_DEVICE
              value: "spinel+hdlc+uart:///dev/ttyACM0?uart-baudrate=460800&uart-flow-control"
            - name: OT_INFRA_IF
              value: net1
            - name: OT_THREAD_IF
              value: wpan0
            - name: OT_REST_LISTEN_ADDR
              value: "0.0.0.0"
            - name: OT_REST_LISTEN_PORT
              value: "8081"
          securityContext:
            privileged: true
          ports:
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /node
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /node
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /node
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 512Mi
              kernel.org/zbt: 1
          volumeMounts:
            - mountPath: /data
              name: config
      securityContext:
        sysctls:
          - name: net.ipv6.conf.all.forwarding
            value: "1"
          - name: net.ipv6.conf.net1.forwarding
            value: "1"
          - name: net.ipv6.conf.net1.accept_ra
            value: "2"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: otbr
