# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otbr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: otbr
  template:
    metadata:
      labels:
        cbannister.xyz/egress: internet
        app: otbr
        app.kubernetes.io/name: otbr
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "thread-infra",
            "namespace": "kube-system",
            "interface": "net1",
            "ips": ["fd74:f571:d3bd:1060::2/64"],
            "mac": "0a:92:17:bd:44:6e"
          }]
    spec:
      hostname: otbr
      containers:
        - name: otbr
          image: openthread/border-router:v2026.11.0@sha256:5ae17855e42000abce4420098c3cc0f16d8b7cf3745ee091810afad75b37d1cc
          env:
            - name: TZ
              value: Europe/London
            - name: OT_RCP_DEVICE
              value: "spinel+hdlc+uart:///dev/ttyACM0?uart-baudrate=460800&uart-flow-control"
            - name: OT_INFRA_IF
              value: net1
            - name: OT_THREAD_IF
              value: wpan0
            - name: OT_REST_LISTEN_ADDR
              value: "0.0.0.0"
            - name: OT_REST_LISTEN_PORT
              value: "8081"
          securityContext:
            privileged: true
          ports:
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /node
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /node
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /node
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 512Mi
              kernel.org/zbt: 1
          volumeMounts:
            - mountPath: /data
              name: config
        # Home Assistant finds border routers only through mDNS, which cannot
        # leave the Thread link, so the relay sends OTBR's border agent
        # records to Home Assistant over the pod network.
        - name: mdns-unicast-relay
          image: ghcr.io/zariel/mdns-unicast-relay:0.1.0@sha256:b6fc1540cb7423373fe6b14e8f121fe2f006fdfc66648bc46f96dab20d3346b5
          args:
            - -interface=net1
            - -service=_meshcop._udp.local
            - -target=home-assistant-mdns.default.svc.cluster.local:5353
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 1m
            limits:
              memory: 32Mi
      securityContext:
        sysctls:
          - name: net.ipv6.conf.all.forwarding
            value: "1"
          - name: net.ipv6.conf.net1.forwarding
            value: "1"
          - name: net.ipv6.conf.net1.accept_ra
            value: "2"
          - name: net.ipv6.conf.net1.autoconf
            value: "0"
          - name: net.ipv6.conf.net1.accept_ra_defrtr
            value: "0"
          - name: net.ipv6.conf.net1.accept_ra_rt_info_max_plen
            value: "0"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: otbr
