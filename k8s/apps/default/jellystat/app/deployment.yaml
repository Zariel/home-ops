---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellystat
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellystat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellystat
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18.6.0@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
          envFrom:
            - secretRef:
                name: jellystat
            - secretRef:
                name: jellystat-initdb
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        - name: init-frontend
          image: &image docker.io/cyfershepard/jellystat:1.1.12@sha256:e61c759ec706da378bc8374e797da1dfd298ab30f804cefd82d192c301a888c7
          command: [/bin/sh, -ec]
          # Jellystat writes dist/env.js at startup; keep the packaged image read-only.
          args: ["cp -R /app/dist/. /frontend/"]
          volumeMounts:
            - name: frontend
              mountPath: /frontend
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: jellystat
          image: *image
          # Task workers resolve their paths relative to the backend directory.
          workingDir: /app/backend
          command: [node, server.js]
          env:
            - name: TZ
              value: Europe/London
            - name: JF_HOST
              value: http://jellyfin.default.svc.cluster.local:8096
            - name: JF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jellystat-jellyfin
                  key: JF_API_KEY
          envFrom:
            - secretRef:
                name: jellystat
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet: &health
              path: /auth/isConfigured
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: *health
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: *health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: backups
              mountPath: /app/backend/backup-data
            - name: frontend
              mountPath: /app/dist
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: jellystat
        - name: frontend
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
