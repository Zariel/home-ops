---
apiVersion: v1
kind: Service
metadata:
  name: jellystat
spec:
  selector:
    app.kubernetes.io/name: jellystat
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellystat
spec:
  hostnames:
    - jellystat.cbannister.xyz
  parentRefs:
    - name: internal-cbannister-xyz
      namespace: network
      kind: ListenerSet
      sectionName: https
  rules:
    - backendRefs:
        - name: jellystat
          port: 3000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: jellystat
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: jellystat
  oidc:
    provider:
      issuer: https://id.cbannister.xyz
    clientID: jellystat
    clientSecret:
      name: jellystat-oidc
    redirectURL: https://jellystat.cbannister.xyz/oauth2/callback
    logoutPath: /logout
    scopes: [openid, profile, email]
    refreshToken: false
    cookieConfig:
      sameSite: Lax
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: jellystat
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: jellystat
  healthCheck:
    panicThreshold: 0
