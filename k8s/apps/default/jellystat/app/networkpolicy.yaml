---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellystat
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: jellystat
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: internal
            gateway.envoyproxy.io/owning-gateway-namespace: network
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEntities: [host]
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
