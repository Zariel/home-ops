---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: jellystat-db
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: password32
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: jellystat-db
          property: password
