---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellystat
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: jellystat
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      data:
        POSTGRES_IP: &host pg18vc-rw.database.svc.cluster.local
        POSTGRES_PORT: "5432"
        POSTGRES_DB: &database jellystat
        POSTGRES_USER: &user jellystat
        POSTGRES_PASSWORD: &password "{{ .db_password }}"
        INIT_POSTGRES_HOST: *host
        INIT_POSTGRES_DBNAME: *database
        INIT_POSTGRES_USER: *user
        INIT_POSTGRES_PASS: *password
        JWT_SECRET: "{{ .jwt_secret }}"
        JS_USER: admin
        JS_PASSWORD: "{{ .admin_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: jellystat-db
        property: password
    - secretKey: jwt_secret
      remoteRef:
        key: jellystat-jwt
        property: password
    - secretKey: admin_password
      remoteRef:
        key: jellystat-admin
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellystat-initdb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: jellystat-initdb
  data:
    - secretKey: INIT_POSTGRES_SUPER_PASS
      remoteRef:
        key: cnpg-pg18vc
        property: password
