---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: jellystat
spec:
  name: Jellystat
  clientID: jellystat
  instanceSelector:
    matchLabels:
      pocketid.internal/instance: pocket-id
  pkceEnabled: true
  callbackUrls:
    - https://jellystat.cbannister.xyz/oauth2/callback
  launchUrl: https://jellystat.cbannister.xyz
  allowedUserGroups:
    - groupName: admin
  accessTokenDurationMinutes: 15
  secret:
    name: jellystat-oidc
    keys:
      clientSecret: client-secret
  logo:
    autoGenerate: false
