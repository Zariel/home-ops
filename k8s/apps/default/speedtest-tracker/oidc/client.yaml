---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: speedtest-tracker
  namespace: default
spec:
  name: Speedtest Tracker
  clientID: speedtest-tracker
  instanceSelector:
    matchLabels:
      pocketid.internal/instance: pocket-id
  pkceEnabled: true
  callbackUrls:
    - https://speedtest.cbannister.xyz/oauth2/callback
  launchUrl: https://speedtest.cbannister.xyz
  allowedUserGroups:
    - groupName: admin
  accessTokenDurationMinutes: 15
  secret:
    name: speedtest-tracker-oidc
    keys:
      clientSecret: client-secret
  logo:
    autoGenerate: false
