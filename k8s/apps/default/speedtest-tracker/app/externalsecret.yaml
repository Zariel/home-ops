---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: speedtest-tracker
spec:
  refreshPolicy: CreatedOnce
  target:
    name: speedtest-tracker-secret
    # Keep the encryption key and bootstrap password across application reinstalls.
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      data:
        APP_KEY: "base64:{{ .encryptionKey | b64enc }}"
        ADMIN_PASSWORD: "{{ .adminPassword }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: password
            target: encryptionKey
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: password
            target: adminPassword
