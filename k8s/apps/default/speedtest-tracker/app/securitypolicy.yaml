---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: speedtest-tracker
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: speedtest-tracker
  oidc:
    provider:
      issuer: https://id.cbannister.xyz
    clientID: speedtest-tracker
    clientSecret:
      name: speedtest-tracker-oidc
    redirectURL: https://speedtest.cbannister.xyz/oauth2/callback
    logoutPath: /logout
    scopes:
      - openid
      - profile
      - email
    refreshToken: false
    cookieConfig:
      sameSite: Lax
