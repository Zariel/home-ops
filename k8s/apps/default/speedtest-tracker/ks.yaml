---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app speedtest-tracker
  namespace: default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: common
      namespace: default
    - name: speedtest-tracker-oidc
      namespace: default
    - name: onepassword-store
      namespace: external-secrets
    - name: envoy-gateway-operator
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 30m
  path: ./k8s/apps/default/speedtest-tracker/app
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 2Gi
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: default
  timeout: 5m
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: speedtest-tracker-oidc
  namespace: default
spec:
  dependsOn:
    - name: pocket-id-instance
      namespace: default
  interval: 1h
  path: ./k8s/apps/default/speedtest-tracker/oidc
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: default
  timeout: 5m
  wait: true
