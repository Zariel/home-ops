---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wizarr
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: wizarr
      app.kubernetes.io/instance: wizarr
  ingress:
    # Wizarr's proxy SSO grants administrator access to requests that reach /login.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: external
            gateway.envoyproxy.io/owning-gateway-namespace: network
      toPorts:
        - ports:
            - port: "5690"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "5690"
              protocol: TCP
