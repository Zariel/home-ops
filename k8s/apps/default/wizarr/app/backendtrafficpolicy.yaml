---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: wizarr
  namespace: default
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: wizarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: wizarr-invitations
  healthCheck:
    panicThreshold: 0
