---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: wizarr
  namespace: default
spec:
  name: Wizarr
  clientID: wizarr
  instanceSelector:
    matchLabels:
      pocketid.internal/instance: pocket-id
  pkceEnabled: true
  callbackUrls:
    - https://join.cbannister.xyz/oauth2/callback
  launchUrl: https://join.cbannister.xyz
  allowedUserGroups:
    - groupName: admin
  accessTokenDurationMinutes: 15
  secret:
    name: wizarr-oidc
    keys:
      clientSecret: client-secret
  logo:
    autoGenerate: false
