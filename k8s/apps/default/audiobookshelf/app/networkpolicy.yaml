---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: audiobookshelf
  namespace: default
spec:
  # DNS and public internet egress, and egress default-deny, come from the
  # internet-egress baseline via the pod label cbannister.xyz/egress.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: audiobookshelf
      app.kubernetes.io/instance: audiobookshelf
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: external
            gateway.envoyproxy.io/owning-gateway-namespace: network
      toPorts: &http
        - ports:
            - port: "80"
              protocol: TCP
    - fromEntities:
        - host
      toPorts: *http
