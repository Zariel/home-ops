---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: thelounge
  namespace: default
spec:
  # DNS and public internet egress, and egress default-deny, come from the
  # internet-egress baseline via the pod label cbannister.xyz/egress. Some
  # networks connect to IRC servers directly.
  endpointSelector:
    matchLabels:
      app: thelounge
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: internal
            gateway.envoyproxy.io/owning-gateway-namespace: network
      toPorts: &web
        - ports:
            - port: "9000"
              protocol: TCP
    - fromEntities:
        - host
      toPorts: *web
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app: znc
      toPorts:
        - ports:
            - port: "6697"
              protocol: TCP
