---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: thelounge
  namespace: default
spec:
  # Pod labels select the shared baselines: cbannister.xyz/ingress admits the
  # internal gateway and kubelet probes; cbannister.xyz/egress grants DNS and
  # public internet egress, which some IRC networks need directly.
  # Fail closed: removing a baseline label must not open the workload.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app: thelounge
  # Ingress comes only from the baseline. This empty rule admits nothing but
  # keeps ingress enforced if the label is removed.
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app: znc
      toPorts:
        - ports:
            - port: "6697"
              protocol: TCP
