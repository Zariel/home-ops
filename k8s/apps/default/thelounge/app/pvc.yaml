# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/persistentvolumeclaim_v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thelounge-config
spec:
  storageClassName: ceph-block
  resources:
    requests:
      storage: 10Gi
  accessModes:
    - ReadWriteOnce
