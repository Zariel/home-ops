apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebrowser
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    volsync: enabled
spec:
  accessModes: [ReadWriteOnce]
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    name: filebrowser-dst
  resources:
    requests:
      storage: 5Gi
  storageClassName: ceph-block
