---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: privatebin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: privatebin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: privatebin
        cbannister.xyz/ingress: internal-gateway
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 82
        fsGroup: 82
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: privatebin
          image: ghcr.io/privatebin/nginx-fpm-alpine:2.1.1@sha256:2e2674fa2f8b18a263fe5577841a6959c5954cd09b9a5476d80a422c277f5a1a
          env:
            - name: TZ
              value: Europe/London
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: &probe
              path: /
              port: http
          livenessProbe:
            httpGet: *probe
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /srv/cfg/conf.php
              subPath: conf.php
              readOnly: true
            - name: config
              mountPath: /etc/nginx/http.d/access_log.conf
              subPath: access_log.conf
              readOnly: true
            - name: data
              mountPath: /srv/data
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            - name: nginx-tmp
              mountPath: /var/lib/nginx/tmp
      volumes:
        - name: config
          configMap:
            name: privatebin
        - name: data
          persistentVolumeClaim:
            claimName: privatebin
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 64Mi
