---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperless
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PAPERLESS_SECRET_KEY
      remoteRef:
        key: paperless
        property: PAPERLESS_SECRET_KEY
    - secretKey: PAPERLESS_ADMIN_PASSWORD
      remoteRef:
        key: paperless
        property: PAPERLESS_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-db
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperless-db
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PAPERLESS_DBPASS
      remoteRef:
        key: paperless-db
        property: PAPERLESS_DBPASS
    - secretKey: INIT_POSTGRES_PASS
      remoteRef:
        key: paperless-db
        property: INIT_POSTGRES_PASS
    - secretKey: INIT_POSTGRES_DBNAME
      remoteRef:
        key: paperless-db
        property: INIT_POSTGRES_DBNAME
    - secretKey: INIT_POSTGRES_USER
      remoteRef:
        key: paperless-db
        property: INIT_POSTGRES_USER
    - secretKey: INIT_POSTGRES_HOST
      remoteRef:
        key: paperless-db
        property: INIT_POSTGRES_HOST
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-valkey
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperless-valkey
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: paperless-valkey
        property: password
    - secretKey: PAPERLESS_REDIS
      remoteRef:
        key: paperless-valkey
        property: PAPERLESS_REDIS
    - secretKey: valkey.conf
      remoteRef:
        key: paperless-valkey
        property: valkey.conf
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-initdb
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperless-initdb
  data:
    - secretKey: INIT_POSTGRES_SUPER_PASS
      remoteRef:
        key: cnpg-pg18vc
        property: password
