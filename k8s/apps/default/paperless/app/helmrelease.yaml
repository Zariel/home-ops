---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: paperless
  driftDetection:
    mode: enabled
  values:
    controllers:
      paperless:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |-
              [{
                "name": "trusted-lan",
                "namespace": "kube-system",
                "interface": "trusted0",
                "ips": ["10.1.2.162/24"],
                "mac": "02:b4:5f:2a:9d:64"
              }]
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom:
              - secretRef:
                  name: paperless-db
              - secretRef:
                  name: paperless-initdb
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.3.0@sha256:6b94799bc769a063b3340cc5847402e626d4d91d29a295a8e747f8e9bead4207
            # Customize the pinned image's AI extraction and retrieval.
            command: ["/bin/sh", "-ec"]
            args:
              - |
                python3 - <<'PY'
                import math
                import os
                from pathlib import Path

                min_similarity = float(os.environ["PAPERLESS_AI_SUGGESTION_MIN_SIMILARITY"])
                if not math.isfinite(min_similarity) or not 0 <= min_similarity <= 1:
                    raise SystemExit("Suggestion minimum similarity must be between 0 and 1")

                def replace_once(source, original, replacement, name):
                    if replacement in source:
                        return source
                    if source.count(original) != 1:
                        raise SystemExit(f"Cannot locate Paperless {name}; review image compatibility")
                    return source.replace(original, replacement, 1)

                path = Path("/usr/src/paperless/src/paperless_ai/ai_classifier.py")
                source = path.read_text()
                patches = [
                    (
                        "English localization guard",
                        "        if output_language:\n",
                        "        if output_language and "
                        "output_language.lower().replace('_', '-').split('-')[0] != 'en':\n",
                    ),
                    (
                        "suggestion relevance guard",
                        "            similar_documents = _node_document_weights(nodes)\n",
                        "            # Reject weak chunks before aggregating scores for candidates and context.\n"
                        "            nodes = [\n"
                        "                node\n"
                        "                for node in nodes\n"
                        f"                if node.score is not None and node.score >= {min_similarity!r}\n"
                        "            ]\n"
                        "            similar_documents = _node_document_weights(nodes)\n",
                    ),
                ]
                for name, original, replacement in patches:
                    source = replace_once(source, original, replacement, name)
                updates = [(path, source)]

                path = Path("/usr/src/paperless/src/paperless_ai/base_model.py")
                source = path.read_text()
                for field in ("tags", "correspondents", "document_types", "storage_paths", "dates"):
                    original = f"    {field}: list[str] = Field(\n        default_factory=list,\n        max_length="
                    replacement = f"    {field}: list[str] = Field(\n        max_length="
                    source = replace_once(source, original, replacement, f"{field} response field")
                updates.append((path, source))

                path = Path("/usr/src/paperless/src/paperless_ai/prompts/classification.j2")
                source = path.read_text()
                original = "Analyze the following document and fill in these fields:\n"
                rules = (
                    "Return one JSON object with all six requested fields. "
                    "Use arrays for tags, correspondents, document_types, storage_paths, and dates. "
                    "Extract only information supported by the document text. "
                    "For correspondents, identify one sender or issuing organisation from the letterhead, "
                    "signature, or explicit statement in the document. "
                    "If no sender or recipient is stated, return correspondents: []. "
                    "Do not invent one or use placeholders such as Unknown sender. "
                    "Return dates: [] if no calendar date is written in the document; never invent or infer a date. "
                    "Give at most one best document type. "
                    "Use [] for any other list field where the document provides no suitable value. "
                    "Do not copy example names from instructions.\n\n"
                )
                source = replace_once(source, original, rules + original, "classification prompt")
                updates.append((path, source))

                # Validate every source before writing or starting Paperless.
                for path, source in updates:
                    if path.suffix == ".py":
                        compile(source, str(path), "exec")
                for path, source in updates:
                    path.write_text(source)
                print(f"AI extraction requires all core fields; English localization disabled; minimum similarity: {min_similarity}")
                PY
                exec /init
            env:
              TZ: Europe/London
              USERMAP_UID: 568
              USERMAP_GID: 568
              PAPERLESS_URL: https://paperless.cbannister.xyz
              PAPERLESS_TIME_ZONE: Europe/London
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_DBHOST: pg18vc-rw.database.svc.cluster.local
              PAPERLESS_DBNAME: paperless
              PAPERLESS_DBUSER: paperless
              PAPERLESS_ADMIN_USER: cbannister
              PAPERLESS_ADMIN_MAIL: c.bannister@gmail.com
              PAPERLESS_OCR_LANGUAGE: eng
              PAPERLESS_TASK_WORKERS: 1
              PAPERLESS_THREADS_PER_WORKER: 2
              PAPERLESS_REDIS:
                valueFrom:
                  secretKeyRef:
                    name: paperless-valkey
                    key: PAPERLESS_REDIS
              PAPERLESS_DATE_ORDER: DMY
              PAPERLESS_DATE_PARSER_LANGUAGES: en
              PAPERLESS_NUMBER_OF_SUGGESTED_DATES: "3"
              PAPERLESS_AI_ENABLED: "true"
              PAPERLESS_AI_LLM_BACKEND: "ollama"
              PAPERLESS_AI_LLM_ENDPOINT: "http://ash.cbannister.casa:11434"
              PAPERLESS_AI_LLM_MODEL: "qwen3:4b-instruct"
              PAPERLESS_AI_LLM_CONTEXT_SIZE: "8192"
              PAPERLESS_AI_LLM_REQUEST_TIMEOUT: "180"
              PAPERLESS_AI_LLM_EMBEDDING_BACKEND: "ollama"
              PAPERLESS_AI_LLM_EMBEDDING_MODEL: "embeddinggemma:300m"
              PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT: "http://ash.cbannister.casa:11434"
              # Local guard; invalidate AI suggestion caches when changing the cutoff.
              PAPERLESS_AI_SUGGESTION_MIN_SIMILARITY: "0.65"
            envFrom:
              - secretRef:
                  name: paperless
              - secretRef:
                  name: paperless-db
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /accounts/login/
                    port: 8000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /accounts/login/
                    port: 8000
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 120
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
          scanner:
            image:
              repository: registry.cbannister.xyz/paperless-scanner
              tag: 4@sha256:4dabee2cf803260dca047e708a13fae515e6d772a7749cb711d582b89503b2e6
            env:
              SCANNER_IP: 10.1.2.70
              CALLBACK_IP: 10.1.2.162
              PYTHONUNBUFFERED: "1"
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [sh, -c, "grep -qi ':D68D ' /proc/net/udp"]
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [sh, -c, "grep -qi ':D68D ' /proc/net/udp"]
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
      valkey:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
        containers:
          app:
            image:
              repository: ghcr.io/valkey-io/valkey
              tag: 9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
            args:
              - /config/valkey.conf
            env:
              VALKEYCLI_AUTH:
                valueFrom:
                  secretKeyRef:
                    name: paperless-valkey
                    key: password
            probes:
              liveness: &valkeyProbe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [valkey-cli, ping]
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *valkeyProbe
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [valkey-cli, ping]
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    service:
      app:
        controller: paperless
        ports:
          http:
            port: 8000
      valkey:
        controller: valkey
        ports:
          valkey:
            port: 6379
    persistence:
      documents:
        existingClaim: paperless
        advancedMounts:
          paperless:
            app:
              - path: /usr/src/paperless/data
                subPath: data
              - path: /usr/src/paperless/media
                subPath: media
              - path: /usr/src/paperless/consume
                subPath: consume
              - path: /usr/src/paperless/export
                subPath: export
            scanner:
              - path: /consume
                subPath: consume
              - path: /scan-spool
                subPath: scanner-spool
      valkey-config:
        type: secret
        name: paperless-valkey
        advancedMounts:
          valkey:
            app:
              - path: /config
                readOnly: true
      valkey-data:
        forceRename: paperless-valkey
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: ceph-block
        size: 1Gi
        advancedMounts:
          valkey:
            app:
              - path: /data
      valkey-tmp:
        type: emptyDir
        advancedMounts:
          valkey:
            app:
              - path: /tmp
    route:
      app:
        hostnames:
          - paperless.cbannister.xyz
        parentRefs:
          - name: internal-cbannister-xyz
            namespace: network
            kind: ListenerSet
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
