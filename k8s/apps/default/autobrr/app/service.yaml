# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/service_v1.json
apiVersion: v1
kind: Service
metadata:
  labels:
    app: &name autobrr
  name: *name
spec:
  selector:
    app: *name
  type: ClusterIP
  ipFamilies:
    - IPv4
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: metrics
      port: 9074
      targetPort: metrics
      protocol: TCP
    - name: bt
      port: 50413
      targetPort: 50413
      protocol: TCP
