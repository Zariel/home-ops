[qbittorrent]
url = "http://qbittorrent.default.svc.cluster.local"

[prowlarr]
url = "http://prowlarr.default.svc.cluster.local"

[limits]
max_candidate_workflows = 1
max_search_workflows = 1
max_indexer_requests = 1
max_filesystem_operations = 1
outbox_batch_size = 4

[arr.sonarr.main]
url = "http://sonarr.default.svc.cluster.local"

[arr.radarr.main]
url = "http://radarr.default.svc.cluster.local"

[data_scan.roots.tv]
path = "/media/media/tv"
max_depth = 8
max_releases = 100000
max_files_per_release = 100000

[data_scan.roots.films]
path = "/media/media/films"
max_depth = 8
max_releases = 100000
max_files_per_release = 100000

[paths]
link_root = "/media/downloads/torrents/complete/sporos"

[[paths.rewrite]]
name = "arr-data"
remote = "/data"
local = "/media"
services = ["qbittorrent", "sonarr", "radarr"]

[sources]
include_categories = ["sonarr", "radarr"]

[matching]
mode = "partial"
season_from_episodes = true

[injection]
dry_run = true
category_template = "sporos"
