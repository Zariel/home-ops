---
apiVersion: v1
kind: Pod
metadata:
  name: brscanr-inspect
  namespace: default
  labels:
    app.kubernetes.io/name: brscanr-inspect
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: brscanr
              app.kubernetes.io/instance: brscanr
          topologyKey: kubernetes.io/hostname
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: inspect
      image: ghcr.io/wizarrrr/wizarr@sha256:08f2c6de534ec7d36d39a4f55b7c5c379021ca881dc519c702aad0ddafbdc67a
      command: [python3, -c, 'import time; time.sleep(3600)']
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: spool
          mountPath: /spool
          readOnly: true
  volumes:
    - name: spool
      persistentVolumeClaim:
        claimName: brscanr
        readOnly: true
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: brscanr-inspect
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: brscanr-inspect
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress: []
  egress: []
