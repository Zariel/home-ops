---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: brscanr
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: brscanr
  driftDetection:
    mode: enabled
  values:
    fullnameOverride: brscanr
    image:
      tag: v0.1.0
      digest: sha256:c0b4d9ba3ed72491700170c162e0e203b4be3142c1de68ca4c3eab4afda2c80e
    scanner:
      printerIP: 10.1.2.70
      destination: BrscanrTest
      buttonSource: feeder
      insecureTLS: true
    callback:
      address: 10.45.0.25
      annotations:
        lbipam.cilium.io/ips: 10.45.0.25
    paperless:
      # The canonical URL also makes imported-document links usable in a browser.
      url: https://paperless.cbannister.xyz/
      existingSecret: brscanr-paperless
    persistence:
      existingClaim: brscanr
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
