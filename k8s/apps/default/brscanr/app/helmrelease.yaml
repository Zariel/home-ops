---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: brscanr
  namespace: default
spec:
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: brscanr
              spec:
                template:
                  spec:
                    containers:
                      - name: brscanr
                        env:
                          - name: TZ
                            value: Europe/London
            target:
              kind: Deployment
              name: brscanr
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: brscanr
  driftDetection:
    mode: enabled
  values:
    fullnameOverride: brscanr
    image:
      tag: v0.1.0
      digest: sha256:c0b4d9ba3ed72491700170c162e0e203b4be3142c1de68ca4c3eab4afda2c80e
    scanner:
      printerIP: 10.1.2.70
      destination: BrscanrTest
      buttonSource: feeder
      insecureTLS: true
    callback:
      address: 10.45.0.25
      annotations:
        lbipam.cilium.io/ips: 10.45.0.25
    paperless:
      # The canonical URL also makes imported-document links usable in a browser.
      url: https://paperless.cbannister.xyz/
      existingSecret: brscanr-paperless
    persistence:
      existingClaim: brscanr
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
