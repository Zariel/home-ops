---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: brscanr
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: brscanr
  oidc:
    provider:
      issuer: https://id.cbannister.xyz
      authorizationEndpoint: https://id.cbannister.xyz/authorize
      endSessionEndpoint: https://id.cbannister.xyz/api/oidc/end-session
      tokenEndpoint: https://pocket-id.default.svc.cluster.local:1411/api/oidc/token
      backendRefs:
        - kind: Service
          name: pocket-id
          port: 1411
    clientID: brscanr
    clientSecret:
      name: brscanr-oidc
    redirectURL: https://brscanr.cbannister.xyz/oauth2/callback
    logoutPath: /logout
    scopes:
      - openid
      - profile
      - email
    # Recheck Pocket ID's admin-group restriction when the 15-minute token expires.
    refreshToken: false
    cookieConfig:
      sameSite: Lax
