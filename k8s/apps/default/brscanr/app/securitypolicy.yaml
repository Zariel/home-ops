---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: brscanr
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: brscanr
  oidc:
    provider:
      issuer: https://id.cbannister.xyz
    clientID: brscanr
    clientSecret:
      name: brscanr-oidc
    redirectURL: https://brscanr.cbannister.xyz/oauth2/callback
    logoutPath: /logout
    scopes:
      - openid
      - profile
      - email
    # Recheck Pocket ID's admin-group restriction when the 15-minute token expires.
    refreshToken: false
    cookieConfig:
      sameSite: Lax
