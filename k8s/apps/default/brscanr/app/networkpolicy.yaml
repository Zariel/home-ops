---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: brscanr
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: brscanr
      app.kubernetes.io/instance: brscanr
  ingress:
    # Local traffic policy on the callback Service preserves this printer identity.
    - fromCIDR:
        - 10.1.2.70/32
      toPorts:
        - ports:
            - port: "54925"
              protocol: UDP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: external
            gateway.envoyproxy.io/owning-gateway-namespace: network
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDR:
        - 10.1.2.70/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "54921"
              protocol: TCP
    # Paperless HTTPS uses the internal gateway's translated listener port.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: internal
            gateway.envoyproxy.io/owning-gateway-namespace: network
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
