---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: brscanr-paperless
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: brscanr-paperless
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: brscanr-paperless
        property: token
