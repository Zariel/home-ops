---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: meilisearch
spec:
  chartRef:
    kind: OCIRepository
    name: meilisearch
  interval: 30m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: "OnRootMismatch"
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568

    controllers:
      meilisearch:
        forceRename: meilisearch
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            app.kubernetes.io/component: meilisearch
        containers:
          app:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
            args:
              - /bin/meilisearch
              - --upgrade-db
            env:
              MEILI_NO_ANALYTICS: true
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: meilisearch-secret
                    key: master_key
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 4Gi

    service:
      app:
        forceRename: meilisearch
        primary: true
        controller: meilisearch
        ports:
          http:
            port: 7700

    persistence:
      data:
        existingClaim: meilisearch
        advancedMounts:
          meilisearch:
            app:
              - path: /meili_data
