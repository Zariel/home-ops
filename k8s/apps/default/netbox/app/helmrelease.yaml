---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: netbox
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 8.3.100
  url: oci://ghcr.io/netbox-community/netbox-chart/netbox
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app netbox
spec:
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: netbox
              spec:
                template:
                  spec:
                    containers:
                      - name: netbox
                        env:
                          - name: TZ
                            value: Europe/London
                    initContainers:
                      - name: init-dirs
                        env:
                          - name: TZ
                            value: Europe/London
                      - name: init-db
                        env:
                          - name: TZ
                            value: Europe/London
            target:
              kind: Deployment
              name: netbox
  interval: 1h
  dependsOn:
    - name: netbox-valkey
  chartRef:
    kind: OCIRepository
    name: netbox
  values:
    commonAnnotations:
      reloader.stakater.com/auto: "true"
    superuser:
      name: cbannister
      email: c.bannister@gmail.com
      # existingSecret: ?
    admins:
      - ["cbannister", "c.bannister@gmail.com"]
    loginRequired: true
    remoteAuth:
      enabled: true
      backends:
        - social_core.backends.open_id_connect.OpenIdConnectAuth
      autoCreateUser: true
    extraVolumes:
      - name: oidc-config
        configMap:
          name: netbox-oidc-config
      - name: oidc-credentials
        secret:
          secretName: netbox-oidc
    extraVolumeMounts:
      - name: oidc-config
        mountPath: /etc/netbox/config/oidc.py
        subPath: oidc.py
        readOnly: true
      - name: oidc-credentials
        mountPath: /run/secrets/oidc
        readOnly: true
    extraConfig:
      - secret:
          secretName: netbox-extra-config
    storages:
      default:
        BACKEND: storages.backends.s3.S3Storage
        OPTIONS:
          bucket_name: netbox
          endpoint_url: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc.cluster.local
          region_name: auto
    plugins: []
    preferIPv4: true
    releaseCheck:
      url: null
    timeZone: Europe/London
    persistence:
      enabled: true
      existingClaim: netbox
    updateStrategy:
      type: Recreate
    initContainers:
      - name: init-db
        env:
          - name: TZ
            value: Europe/London
        image: ghcr.io/home-operations/postgres-init:18.7.0@sha256:6d4cfa4b8d343eb6fa0de8dd9ec416a2007f346bb631fc8e246e1f39eee6c4aa
        envFrom:
          - secretRef:
              name: netbox-db
          - secretRef:
              name: netbox-initdb
    resourcesPreset: none
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    postgresql:
      enabled: false
    externalDatabase:
      host: pg18vc-rw.database.svc.cluster.local
      port: 5432
      database: netbox
      username: netbox
      existingSecretName: netbox-db
      existingSecretKey: DB_PASSWORD
    valkey:
      enabled: false
    tasksDatabase: &valkeyDatabase
      host: netbox-valkey.default.svc.cluster.local
      port: 6379
      existingSecretName: netbox-valkey-auth
      existingSecretKey: password
    cachingDatabase: *valkeyDatabase
    housekeeping:
      enabled: false
    worker:
      enabled: false
    livenessProbe:
      enabled: false
    customLivenessProbe:
      failureThreshold: 5
      initialDelaySeconds: 10
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 5
      httpGet:
        path: /login/
        port: http
    startupProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 100
      successThreshold: 1
  valuesFrom:
    - targetPath: storages.default.OPTIONS.access_key
      kind: Secret
      name: netbox-obc
      valuesKey: AWS_ACCESS_KEY_ID
    - targetPath: storages.default.OPTIONS.secret_key
      kind: Secret
      name: netbox-obc
      valuesKey: AWS_SECRET_ACCESS_KEY
