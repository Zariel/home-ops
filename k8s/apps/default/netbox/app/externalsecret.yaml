---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: netbox-db
    template:
      data:
        DB_PASSWORD: "{{ .NETBOX_DB_PASSWORD }}"
        # --
        INIT_POSTGRES_DBNAME: netbox
        INIT_POSTGRES_HOST: pg18vc-rw.database.svc.cluster.local
        INIT_POSTGRES_PASS: "{{ .NETBOX_DB_PASSWORD }}"
        INIT_POSTGRES_USER: netbox
  dataFrom:
    - extract:
        key: netbox
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-initdb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: netbox-initdb
  data:
    - secretKey: INIT_POSTGRES_SUPER_PASS
      remoteRef:
        key: cnpg-pg18vc
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-extra-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: netbox-extra-config
    template:
      data:
        api-token-peppers.yaml: |
          API_TOKEN_PEPPERS:
            1: "{{ .NETBOX_API_TOKEN_PEPPER_1 }}"
  dataFrom:
    - extract:
        key: netbox
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: netbox
    template:
      data:
        NETBOX_TOKEN: "{{ .NETBOX_API_TOKEN }}"
  dataFrom:
    - extract:
        key: netbox
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-valkey-auth
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: netbox-valkey-auth
    template:
      data:
        password: "{{ .VALKEY_PASSWORD }}"
        valkey.conf: |
          bind 0.0.0.0
          protected-mode yes
          port 6379
          requirepass {{ .VALKEY_PASSWORD }}
          dir /data
          appendonly yes
          appendfsync everysec
          save 60 1
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "VALKEY_PASSWORD"
