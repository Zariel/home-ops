# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: netbox
  namespace: default
spec:
  name: NetBox
  clientID: netbox
  instanceSelector:
    matchLabels:
      pocketid.internal/instance: pocket-id
  pkceEnabled: true
  callbackUrls:
    - https://netbox.cbannister.xyz/oauth/complete/oidc/
  launchUrl: https://netbox.cbannister.xyz
  allowedUserGroups:
    - groupName: admin
  secret:
    name: netbox-oidc
  logo:
    autoGenerate: false
