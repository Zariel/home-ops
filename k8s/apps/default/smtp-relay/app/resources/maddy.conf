state_dir /cache/state
runtime_dir /cache/run

openmetrics tcp://0.0.0.0:{env:SMTP_RELAY_METRICS_PORT} { }

tls file /etc/maddy/tls/tls.crt /etc/maddy/tls/tls.key
hostname {env:SMTP_RELAY_HOSTNAME}

# Senders authenticate after STARTTLS. Each login is a sender address, and
# authorize_sender lets it use only that address in the envelope and the
# From header, so no sender can mail as another or as the Fastmail account.
submission tcp://0.0.0.0:{env:SMTP_RELAY_SUBMISSION_PORT} {
    auth pass_table static {
        entry {env:SMTP_RELAY_POCKET_ID_USER} {env:SMTP_RELAY_POCKET_ID_HASH}
    }
    check {
        authorize_sender
    }
    default_source {
        deliver_to &remote_queue
    }
}

target.queue remote_queue {
    target &remote_smtp
}

target.smtp remote_smtp {
    # The tls:// target uses implicit TLS with certificate verification;
    # STARTTLS inside that session would fail because Fastmail does not offer it.
    starttls no
    auth plain {env:SMTP_RELAY_USERNAME} {env:SMTP_RELAY_PASSWORD}
    targets tls://{env:SMTP_RELAY_SERVER}:{env:SMTP_RELAY_SERVER_PORT}
}
