---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/service_v1.json
apiVersion: v1
kind: Service
metadata:
  name: smtp-relay
  labels:
    app.kubernetes.io/instance: smtp-relay
    app.kubernetes.io/name: smtp-relay
    app.kubernetes.io/service: smtp-relay
spec:
  type: ClusterIP
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: submission
      port: 587
      protocol: TCP
      targetPort: 587
  selector:
    app.kubernetes.io/component: smtp-relay
    app.kubernetes.io/instance: smtp-relay
    app.kubernetes.io/name: smtp-relay
