---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smtp-relay
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: smtp-relay-secret
    template:
      engineVersion: v2
      data:
        SMTP_RELAY_HOSTNAME: "{{ .SMTP_RELAY_HOSTNAME }}"
        SMTP_RELAY_SERVER: "{{ .SMTP_RELAY_SERVER }}"
        SMTP_RELAY_USERNAME: "{{ .SMTP_RELAY_USERNAME }}"
        SMTP_RELAY_PASSWORD: "{{ .SMTP_RELAY_PASSWORD }}"
        # The relay holds only the hash; Pocket ID's settings hold the password.
        SMTP_RELAY_POCKET_ID_USER: "{{ .pocket_id_username }}"
        SMTP_RELAY_POCKET_ID_HASH: "{{ .pocket_id_password_hash }}"
  data:
    - secretKey: pocket_id_username
      remoteRef:
        key: smtp-relay-pocket-id
        property: username
    - secretKey: pocket_id_password_hash
      remoteRef:
        key: smtp-relay-pocket-id
        property: password_hash
  dataFrom:
    - extract:
        key: smtp-relay
