# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-relay
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/component: smtp-relay
    app.kubernetes.io/instance: smtp-relay
    app.kubernetes.io/name: smtp-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: smtp-relay
      app.kubernetes.io/instance: smtp-relay
      app.kubernetes.io/name: smtp-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/component: smtp-relay
        app.kubernetes.io/instance: smtp-relay
        app.kubernetes.io/name: smtp-relay
    spec:
      containers:
        - name: app
          image: ghcr.io/foxcpp/maddy:0.9.8@sha256:f2396d08bad7cc3e2ec76422530a6310644ac03d435093991150486a791b08a2
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/London
            - name: SMTP_RELAY_METRICS_PORT
              value: "8080"
            - name: SMTP_RELAY_SERVER_PORT
              value: "465"
            - name: SMTP_RELAY_SUBMISSION_PORT
              value: "587"
          envFrom:
            - secretRef:
                name: smtp-relay-secret
          livenessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            httpGet:
              path: /metrics
              port: 8080
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            httpGet:
              path: /metrics
              port: 8080
            timeoutSeconds: 1
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /cache
              name: cache
            - mountPath: /etc/maddy/tls
              name: tls
              readOnly: true
            - mountPath: /data/maddy.conf
              name: config
              readOnly: true
              subPath: maddy.conf
      securityContext:
        fsGroup: 568
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
      volumes:
        - emptyDir: {}
          name: cache
        - configMap:
            defaultMode: 420
            name: smtp-relay-configmap
          name: config
        - name: tls
          secret:
            secretName: smtp-relay-tls
            defaultMode: 0440
