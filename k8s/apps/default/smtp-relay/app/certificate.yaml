---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smtp-relay
spec:
  secretName: smtp-relay-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cluster-ca
  dnsNames:
    - smtp-relay.default.svc.cluster.local
  usages:
    - server auth
