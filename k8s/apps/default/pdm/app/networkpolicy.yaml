---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pdm
  namespace: default
spec:
  # Pod labels select the shared policies listed in k8s/README.md. Each
  # direction has its own rule, so removing a label cannot open the workload.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pdm
  ingress:
    - {}
  egress:
    # Proxmox VE on pbj and the backup server's API on 10.1.1.32.
    - toCIDR:
        - 10.1.1.31/32
      toPorts:
        - ports:
            - port: "8006"
              protocol: TCP
    - toCIDR:
        - 10.1.1.32/32
      toPorts:
        - ports:
            - port: "8007"
              protocol: TCP
    # Proxmox VE on postgres.cbannister.casa.
    - toCIDR:
        - 10.1.1.41/32
      toPorts:
        - ports:
            - port: "8006"
              protocol: TCP
