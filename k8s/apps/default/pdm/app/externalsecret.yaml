---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pdm
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pdm
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PDM_ROOT_PASSWORD
      remoteRef:
        key: pdm
        property: PDM_ROOT_PASSWORD
