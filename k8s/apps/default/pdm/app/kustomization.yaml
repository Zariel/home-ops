---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - deployment.yaml
  - pvc.yaml
  - app.secret.sops.yaml
  - certificate.yaml
  - service.yaml
  - httproute.yaml
  - backendtlspolicy.yaml
  - oidc-client.yaml
configMapGenerator:
  - name: pdm-access
    files:
      - domains.cfg=./config/domains.cfg
      - user.cfg=./config/user.cfg
      - acl.cfg=./config/acl.cfg
generatorOptions:
  disableNameSuffixHash: true
