# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  app: sabnzbd
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - externalsecret.yaml
configMapGenerator:
  - name: sabnzbd-scripts
    files:
      - clean.py=resources/clean.py
      - post-process.sh=resources/post-process.sh
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
