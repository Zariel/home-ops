---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flare
  namespace: default
spec:
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: common
    - name: flare-database
      namespace: database
    - name: onepassword-store
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
  interval: 1h
  path: ./k8s/apps/default/flare/app
  postBuild:
    substitute:
      APP: flare
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_PUID: "1001"
      VOLSYNC_PGID: "1001"
      VOLSYNC_SOURCE_CACHE_CAPACITY: 1Gi
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: default
  timeout: 10m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: flare
      namespace: default
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flare-oidc
  namespace: default
spec:
  dependsOn:
    - name: pocket-id-instance
  interval: 1h
  path: ./k8s/apps/default/flare/oidc
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: default
  timeout: 5m
  wait: true
