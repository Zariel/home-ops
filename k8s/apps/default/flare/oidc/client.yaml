---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: flare
spec:
  name: Flare
  clientID: flare
  instanceSelector:
    matchLabels:
      pocketid.internal/instance: pocket-id
  pkceEnabled: true
  callbackUrls:
    - https://flare.cbannister.xyz/api/auth/callback/oidc
  launchUrl: https://flare.cbannister.xyz
  allowedUserGroups:
    - groupName: admin
  secret:
    name: flare-oidc
  logo:
    autoGenerate: false
