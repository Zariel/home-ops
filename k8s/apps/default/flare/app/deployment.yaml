---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flare
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flare
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flare
        cbannister.xyz/ingress: internal-gateway
        cbannister.xyz/egress-internal-gateway: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flare
          image: ghcr.io/flintsh/flare:3.1.0@sha256:138b5d525d3bf08c05e9e822066628338c6ac3c2572715eb46914a028716b765
          # Kubernetes sets the volume group, so run the image's startup script directly.
          command: ["/app/start.sh"]
          env:
            - name: TZ
              value: Europe/London
            - name: NEXTAUTH_URL
              value: https://flare.cbannister.xyz
            - name: FLARE_CLIENT_IP_HEADER
              value: X-Flare-Client-IP
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flare
                  key: DATABASE_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: flare
                  key: NEXTAUTH_SECRET
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet: &health
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 48
          readinessProbe:
            httpGet: *health
          livenessProbe:
            httpGet: *health
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: upload-tmp
              mountPath: /app/tmp
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: flare
        - name: upload-tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
