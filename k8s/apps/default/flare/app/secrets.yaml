---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: flare-session
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: password64
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: flare-session
          property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flare
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    template:
      data:
        DATABASE_URL: "postgresql://flare:{{ .db_password }}@pg18vc-rw.database.svc.cluster.local:5432/flare?schema=public&sslmode=require&connection_limit=5"
        NEXTAUTH_SECRET: "{{ .session_secret }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: flare-db
        property: password
    - secretKey: session_secret
      remoteRef:
        key: flare-session
        property: password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: flare-recovery
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: password64
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: flare-recovery
          property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flare-recovery
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: flare-recovery
        property: password
