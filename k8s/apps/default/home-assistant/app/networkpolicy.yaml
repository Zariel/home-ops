---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: home-assistant
  namespace: default
spec:
  # Pod labels select the shared baselines: cbannister.xyz/ingress admits the
  # internal gateway and kubelet probes; cbannister.xyz/egress grants DNS and
  # public internet egress for cloud integrations; cbannister.xyz/egress-ollama
  # grants Ollama on ash.
  # Cilium enforces only on eth0. The IoT Multus interface gives direct access
  # to the IoT network; Trusted and ROON devices are reached through eth0.
  # Fail closed: removing a baseline label must not open the workload.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
      app.kubernetes.io/instance: home-assistant
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp
            app.kubernetes.io/name: home-assistant-mcp
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: matterjs
      toPorts:
        - ports:
            - port: "5580"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: otbr
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # The Roon Core's API on the ROON VLAN, routed through eth0.
    - toCIDR:
        - 10.1.4.10/32
      toPorts:
        - ports:
            - port: "9330"
              protocol: TCP
    # The Bluesound players' control API on the ROON VLAN.
    - toCIDR:
        - 10.1.4.13/32
        - 10.1.4.14/32
      toPorts:
        - ports:
            - port: "11000"
              protocol: TCP
    # Trusted LAN devices, routed through eth0.
    - toCIDR:
        - 10.1.2.53/32
      toPorts:
        - ports:
            # Anthem A/V control.
            - port: "14999"
              protocol: TCP
    - toCIDR:
        - 10.1.2.54/32
      toPorts:
        - ports:
            # Kodi JSON-RPC over HTTP and WebSocket.
            - port: "8080"
              protocol: TCP
            - port: "9090"
              protocol: TCP
    - toCIDR:
        - 10.1.2.56/32
      toPorts:
        - ports:
            # Unfolded Circle remote API.
            - port: "80"
              protocol: TCP
    - toCIDR:
        - 10.1.2.70/32
      toPorts:
        - ports:
            # Brother printer status over SNMP.
            - port: "161"
              protocol: UDP
  egressDeny:
    # The printer's mDNS advertisement reaches Home Assistant through the IoT
    # interface, and each one starts an IPP discovery probe to port 631. The
    # Brother integration already reports the printer's status, so the probe is
    # denied explicitly and logged as POLICY_DENY rather than an unexpected drop.
    # The advertisements stop once the NixOS gateway replaces VyOS.
    - toCIDR:
        - 10.1.2.70/32
      toPorts:
        - ports:
            - port: "631"
              protocol: TCP
    # Home Assistant sends two UDP packets to port 80 on its default gateway,
    # the node's Cilium internal address, at startup and hourly after. Nothing
    # listens there, and the sending integration has not been identified.
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: UDP
