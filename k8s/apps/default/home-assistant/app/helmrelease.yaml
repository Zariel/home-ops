---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.11.2@sha256:28ae630554f1f2dd43ecbdecad9d974f09f02b17a0a769a290ceec094ec427dc
            env:
              TZ: Europe/London
              HASS_HTTP_TRUSTED_PROXY_1: 10.45.0.0/24
              HASS_HTTP_TRUSTED_PROXY_2: 172.20.0.0/16
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 768Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      labels:
        cbannister.xyz/egress: internet
        cbannister.xyz/egress-ollama: "true"
        cbannister.xyz/ingress: internal-gateway
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot",
            "namespace": "kube-system",
            "ips": ["10.1.3.120/24"],
            "mac": "02:b4:5f:2a:9d:61"
          },
          {
            "name": "trusted-lan",
            "namespace": "kube-system",
            "interface": "trusted0",
            "ips": ["10.1.2.160/24"],
            "mac": "02:b4:5f:2a:9d:62"
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        sysctls:
          - name: net.ipv4.ip_forward
            value: "0"
          - name: net.ipv6.conf.all.forwarding
            value: "0"
          # Matter and Thread run in their own pods, so the LAN interfaces are
          # IPv4-only and cannot carry a default route around network policy.
          - name: net.ipv6.conf.net1.disable_ipv6
            value: "1"
          - name: net.ipv6.conf.trusted0.disable_ipv6
            value: "1"
    service:
      app:
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: 8123
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.cbannister.xyz"
          - hass.cbannister.xyz
        parentRefs:
          - name: internal-cbannister-xyz
            namespace: network
            kind: ListenerSet
            sectionName: https
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      config-cache:
        existingClaim: "{{ .Release.Name }}-cache"
        globalMounts:
          - path: /config/.venv
      tmp:
        type: emptyDir
