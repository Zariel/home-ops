---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.11.3@sha256:96c244d8aa3586026bb8d4fdc0dcf9b34f348874a1ea5060942356cf181177bc
            env:
              TZ: Europe/London
              HASS_HTTP_TRUSTED_PROXY_1: 10.45.0.0/24
              HASS_HTTP_TRUSTED_PROXY_2: 172.20.0.0/16
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 768Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      labels:
        cbannister.xyz/egress: internet
        cbannister.xyz/egress-ollama: "true"
        cbannister.xyz/ingress: internal-gateway
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot",
            "namespace": "kube-system",
            "interface": "iot0",
            "ips": ["10.1.3.120/24"],
            "mac": "02:b4:5f:2a:9d:61"
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        sysctls:
          - name: net.ipv4.ip_forward
            value: "0"
          - name: net.ipv6.conf.all.forwarding
            value: "0"
          # Matter and Thread run in their own pods, so the IoT interface is
          # IPv4-only and cannot carry a default route around network policy.
          # OTBR's border agent advert arrives through the mdns Service.
          - name: net.ipv6.conf.iot0.disable_ipv6
            value: "1"
    service:
      app:
        # Keep the established name now that the release has two Services.
        forceRename: "{{ .Release.Name }}"
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: 8123
      # OTBR's mdns-unicast-relay sidecar sends its _meshcop._udp records
      # here, so the Thread integration finds the border router without an
      # attachment to the Thread link.
      mdns:
        controller: home-assistant
        ports:
          mdns:
            port: 5353
            protocol: UDP
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.cbannister.xyz"
          - hass.cbannister.xyz
        parentRefs:
          - name: internal-cbannister-xyz
            namespace: network
            kind: ListenerSet
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8123
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      config-cache:
        existingClaim: "{{ .Release.Name }}-cache"
        globalMounts:
          - path: /config/.venv
      tmp:
        type: emptyDir
