---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: znc
  namespace: default
spec:
  # DNS and public internet egress, and egress default-deny, come from the
  # internet-egress baseline via the pod label cbannister.xyz/egress. IRC
  # servers and the image's startup package downloads are public.
  endpointSelector:
    matchLabels:
      app: znc
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: internal
            gateway.envoyproxy.io/owning-gateway-namespace: network
      toPorts: &web
        - ports:
            - port: "6501"
              protocol: TCP
    - fromEntities:
        - host
      toPorts: *web
    # IRC clients of the bouncer.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
          matchExpressions:
            - key: app
              operator: In
              values:
                - autobrr
                - thelounge
      toPorts:
        - ports:
            - port: "6697"
              protocol: TCP
