---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &app znc
  labels:
    app: *app
spec:
  selector:
    matchLabels:
      app: *app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: *app
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      hostname: *app
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: *app
        - name: tls
          secret:
            secretName: znc-tls
            defaultMode: 0440
        - name: custom-init
          configMap:
            name: znc-custom-init
            defaultMode: 0775
        - name: modules
          configMap:
            name: znc-modules
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: *app
          image: ghcr.io/linuxserver/znc:1.10.3@sha256:ff2c194144b53a2d981ca21eba5158ade449b43c7a23d0f3a6b9de7734cdb2d8
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: Europe/London
          ports:
            - containerPort: 6501
              name: web
            - containerPort: 6697
              name: irc-tls
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tls
              mountPath: /config/znc.pem
              subPath: tls-combined.pem
              readOnly: true
            - name: custom-init
              mountPath: /custom-cont-init.d/disable-protected-web-sessions.sh
              subPath: disable-protected-web-sessions.sh
              readOnly: true
            - name: modules
              mountPath: /config/modules/knock.py
              subPath: knock.py
              readOnly: true
          startupProbe:
            tcpSocket:
              port: web
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: web
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: web
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
