---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: karakeep
  namespace: default
spec:
  # DNS and public internet egress come from the
  # internet-egress baseline via the pod label cbannister.xyz/egress.
  # cbannister.xyz/egress-ollama grants the app component Ollama on ash.
  # Fail closed: removing a baseline label must not open the workload.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: karakeep
      app.kubernetes.io/component: application
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: internal
            gateway.envoyproxy.io/owning-gateway-namespace: network
      toPorts: &http
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEntities:
        - host
      toPorts: *http
  # The crawler fetches feeds and assets from bookmarked URLs, so private
  # destinations are limited to its own dependencies.
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: karakeep
            app.kubernetes.io/component: chrome
      toPorts:
        - ports:
            - port: "9222"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: meilisearch
      toPorts:
        - ports:
            - port: "7700"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: karakeep-chrome
  namespace: default
spec:
  # DNS and public internet egress come from the
  # internet-egress baseline via the pod label cbannister.xyz/egress.
  # Fail closed: removing a baseline label must not open the workload.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: karakeep
      app.kubernetes.io/component: chrome
  # The DevTools endpoint grants full browser control.
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: karakeep
            app.kubernetes.io/component: application
      toPorts: &devtools
        - ports:
            - port: "9222"
              protocol: TCP
    - fromEntities:
        - host
      toPorts: *devtools
