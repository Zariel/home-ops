---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  chartRef:
    kind: OCIRepository
    name: karakeep
  interval: 30m
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: "OnRootMismatch"
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568

    controllers:
      karakeep:
        forceRename: karakeep
        replicas: 1
        # SQLite and the RWO volume have a single application owner.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            app.kubernetes.io/component: application
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
            env:
              BROWSER_WEB_URL: http://karakeep-chrome.default.svc.cluster.local:9222
              CRAWLER_DOWNLOAD_BANNER_IMAGE: true
              CRAWLER_ENABLE_ADBLOCKER: true
              CRAWLER_STORE_SCREENSHOT: true
              DATA_DIR: /data
              DISABLE_SIGNUPS: true
              OPENAI_BASE_URL: http://ash.cbannister.casa:11434/v1
              OPENAI_API_KEY: ollama
              OPENAI_TIMEOUT_SEC: 120
              INFERENCE_TEXT_MODEL: qwen3:4b-instruct
              INFERENCE_CONTEXT_LENGTH: 8192
              INFERENCE_JOB_TIMEOUT_SEC: 120
              EMBEDDING_ENABLE_AUTO_INDEXING: true
              EMBEDDING_TEXT_MODEL: embeddinggemma:300m
              EMBEDDING_DIMENSIONS: 768
              EMBEDDING_CONTEXT_LENGTH: 2048
              MEILI_ADDR: http://meilisearch.default.svc.cluster.local:7700
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: meilisearch-secret
                    key: master_key
              NEXTAUTH_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: encryption_key
              NEXTAUTH_URL: https://karakeep.cbannister.xyz
              DISABLE_NEW_RELEASE_CHECK: true
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /api/health
                spec:
                  timeoutSeconds: 5
              readiness:
                enabled: true
                type: HTTP
                path: /api/health
                spec:
                  timeoutSeconds: 5
              startup:
                enabled: true
                type: HTTP
                path: /api/health
                spec:
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 768Mi
              limits:
                memory: 2Gi

      chrome:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # The pod sandbox reaps orphaned Chromium subprocesses.
          shareProcessNamespace: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          labels:
            app.kubernetes.io/component: chrome
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep-chrome
              tag: 151.0.7922.47-r1@sha256:5b19bbb160e9ff60681a3abd97e1c4ec9f64212301410de658c3900ab7ef31e7
            args:
              - --disable-gpu
              - --disable-dev-shm-usage
              - --hide-scrollbars
              - --disable-blink-features=AutomationControlled
              - --window-size=1440,900
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /json/version
                port: 9222
                spec:
                  timeoutSeconds: 5
              readiness:
                enabled: true
                type: HTTP
                path: /json/version
                port: 9222
                spec:
                  timeoutSeconds: 5
              startup:
                enabled: true
                type: HTTP
                path: /json/version
                port: 9222
                spec:
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 24
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      app:
        forceRename: karakeep
        primary: true
        controller: karakeep
        ports:
          http:
            port: 3000
      chrome:
        controller: chrome
        ports:
          http:
            port: 9222

    persistence:
      data:
        existingClaim: karakeep
        advancedMounts:
          karakeep:
            app:
              - path: /data
                subPath: karakeep

    route:
      app:
        hostnames:
          - karakeep.cbannister.xyz
        parentRefs:
          - name: internal-cbannister-xyz
            namespace: network
            kind: ListenerSet
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
