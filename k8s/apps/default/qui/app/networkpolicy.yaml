---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qui
  namespace: default
spec:
  # DNS and public internet egress come from the
  # internet-egress baseline via the pod label cbannister.xyz/egress.
  # Fail closed: removing a baseline label must not open the workload.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qui
  ingress:
    # qui runs with authentication disabled and controls qBittorrent, so this
    # rule is its access control.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: internal
            gateway.envoyproxy.io/owning-gateway-namespace: network
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app: autobrr
      toPorts: &web
        - ports:
            - port: "80"
              protocol: TCP
    - fromEntities:
        - host
      toPorts: *web
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: qbittorrent
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: sonarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app: radarr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    # Indexer searches.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app: prowlarr
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
