# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id-operator
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: pocket-id-operator
  values:
    instance:
      enabled: false
    metrics:
      prometheusRule:
        enabled: false
