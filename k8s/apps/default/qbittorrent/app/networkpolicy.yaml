---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent
  namespace: default
spec:
  # DNS and public internet egress come from the
  # internet-egress baseline via the pod label cbannister.xyz/egress.
  # Fail closed: removing a baseline label must not open the workload.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
      app.kubernetes.io/instance: qbittorrent
  ingress:
    # The LoadBalancer's local traffic policy preserves peer addresses.
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "50413"
              protocol: TCP
            - port: "50413"
              protocol: UDP
    # The persisted WebUI subnet whitelist includes the pod CIDR, so this rule
    # decides which workloads get unauthenticated access.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: internal
            gateway.envoyproxy.io/owning-gateway-namespace: network
        - matchLabels:
            io.kubernetes.pod.namespace: default
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - brrpolice
                - qui
                - sonarr
        - matchLabels:
            io.kubernetes.pod.namespace: default
          matchExpressions:
            - key: app
              operator: In
              values:
                # autobrr's autoannounce.sh calls the API directly.
                - autobrr
                # Prowlarr sends manual grabs to qBittorrent.
                - prowlarr
                - radarr
      toPorts: &web
        - ports:
            - port: "80"
              protocol: TCP
    - fromEntities:
        - host
      toPorts: *web
  # Some peers advertise shared-address-space (CGNAT/Tailscale) addresses,
  # which the internet egress baseline excludes. Deny them explicitly so the
  # drops report POLICY_DENY rather than a missing allow rule.
  egressDeny:
    - toCIDR:
        - 100.64.0.0/10
