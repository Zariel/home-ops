---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent
  namespace: default
spec:
  # DNS and public internet egress, and egress default-deny, come from the
  # internet-egress baseline via the pod label cbannister.xyz/egress.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
      app.kubernetes.io/instance: qbittorrent
  ingress:
    # The LoadBalancer's local traffic policy preserves peer addresses.
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "50413"
              protocol: TCP
            - port: "50413"
              protocol: UDP
    # The persisted WebUI subnet whitelist includes the pod CIDR, so this rule
    # decides which workloads get unauthenticated access.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: internal
            gateway.envoyproxy.io/owning-gateway-namespace: network
        - matchLabels:
            io.kubernetes.pod.namespace: default
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - brrpolice
                - qui
                - sonarr
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app: radarr
      toPorts: &web
        - ports:
            - port: "80"
              protocol: TCP
    - fromEntities:
        - host
      toPorts: *web
