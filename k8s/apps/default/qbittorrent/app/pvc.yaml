kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: qbittorrent-incomplete
spec:
  storageClassName: openebs-hostpath
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 100Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-lt12
  namespace: default
  labels:
    volsync: enabled
spec:
  storageClassName: ceph-block
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
