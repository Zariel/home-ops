---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless-gpt
  namespace: default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: paperless
    - name: volsync
      namespace: volsync-system
  path: ./k8s/apps/default/paperless-gpt/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  targetNamespace: default
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 1Gi
