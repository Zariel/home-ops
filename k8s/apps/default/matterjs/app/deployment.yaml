# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matterjs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matterjs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matterjs
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "matter-controllers",
            "namespace": "kube-system",
            "interface": "net1",
            "ips": ["fd74:f571:d3bd:1061::2/64"],
            "mac": "02:d8:6a:f3:81:29"
          }]
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        sysctls:
          - name: net.ipv6.conf.net1.accept_ra
            value: "0"
          - name: net.ipv6.conf.net1.autoconf
            value: "0"
      containers:
        - name: matterjs
          image: ghcr.io/matter-js/matterjs-server:1.5.5@sha256:ee149c7c67eff0e90f131e8f0d628f7b099591ec58473c8cda1209e8ae4df66e
          imagePullPolicy: IfNotPresent
          args:
            - --storage-path=/data
            - --primary-interface=net1
            - --log-level=debug
          env:
            - name: TZ
              value: "Europe/London"
            - name: MATTER_SERVER__INSTANCE_NAME
              value: "matter-server"
            - name: MATTER_SERVER__PORT
              value: "5580"
            - name: MATTER_SERVER__APPLICATION_URL
              value: "matter.cbannister.xyz"
          ports:
            - name: http
              containerPort: 5580
              protocol: TCP
          securityContext:
            privileged: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matterjs
