---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: silo
  namespace: default
spec:
  # Pod labels select the shared policies listed in k8s/README.md. Each
  # direction has its own rule, so removing a label cannot open the workload.
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: silo
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: external
            gateway.envoyproxy.io/owning-gateway-namespace: network
      toPorts: &http
        - ports:
            - port: "8080"
              protocol: TCP
    # Kubelet probes originate on the node hosting Silo.
    - fromEntities:
        - host
      toPorts: *http
    # Sonarr and Radarr call the autoscan webhook after imports.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: sonarr
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app: radarr
      toPorts: *http
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            cnpg.io/cluster: pg18vc
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
