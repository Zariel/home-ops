apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-initdb
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: silo-initdb
  data:
    - secretKey: INIT_POSTGRES_SUPER_PASS
      remoteRef:
        key: cnpg-pg18vc
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-app
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: silo-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: silo-app
        property: DATABASE_URL
    - secretKey: SECRET_KEY
      remoteRef:
        key: silo-app
        property: SECRET_KEY
    - secretKey: INIT_POSTGRES_HOST
      remoteRef:
        key: silo-app
        property: INIT_POSTGRES_HOST
    - secretKey: INIT_POSTGRES_USER
      remoteRef:
        key: silo-app
        property: INIT_POSTGRES_USER
    - secretKey: INIT_POSTGRES_DBNAME
      remoteRef:
        key: silo-app
        property: INIT_POSTGRES_DBNAME
    - secretKey: INIT_POSTGRES_PASS
      remoteRef:
        key: silo-app
        property: INIT_POSTGRES_PASS
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-recovery
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: silo-recovery
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: silo-recovery
        property: username
    - secretKey: email
      remoteRef:
        key: silo-recovery
        property: email
    - secretKey: password
      remoteRef:
        key: silo-recovery
        property: password
