apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: silo
  namespace: default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: silo
  dependsOn:
    - name: pg18vc
      namespace: database
    - name: onepassword-store
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
  components:
    - ../../../../components/volsync
  interval: 1h
  postBuild:
    substitute:
      APP: silo
      VOLSYNC_CAPACITY: 10Gi
  path: ./k8s/apps/default/silo/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: default
  timeout: 25m
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: silo-oidc
  namespace: default
spec:
  dependsOn:
    - name: pocket-id-instance
  interval: 1h
  path: ./k8s/apps/default/silo/oidc
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  targetNamespace: default
  timeout: 5m
  wait: true
