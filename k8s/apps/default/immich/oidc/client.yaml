apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: immich
  namespace: default
spec:
  name: Immich
  clientID: immich
  instanceSelector:
    matchLabels:
      pocketid.internal/instance: pocket-id
  pkceEnabled: true
  callbackUrls:
    - https://photos.cbannister.xyz/auth/login
    - https://photos.cbannister.xyz/user-settings
    - app.immich:///oauth-callback
  launchUrl: https://photos.cbannister.xyz
  allowedUserGroups:
    - name: immich
      namespace: default
  secret:
    name: immich-oidc
    additionalLabels:
      reconcile.fluxcd.io/watch: Enabled
  logo:
    autoGenerate: false
