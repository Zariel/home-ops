---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-valkey
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: immich
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      valkey:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          valkey:
            image:
              repository: ghcr.io/valkey-io/valkey
              tag: 9.1.2@sha256:a91d34ab33975b1054e26f1bd9995b268f7e0c507b5ded7f3d181a1a25521630
            args:
              - /config/valkey.conf
              - --save
              - ""
              - --tls-port
              - "6379"
              - --port
              - "0"
              - --tls-cert-file
              - /certs/tls.crt
              - --tls-key-file
              - /certs/tls.key
              - --tls-ca-cert-file
              - /certs/ca.crt
              - --tls-auth-clients
              - "no"
            probes:
              liveness: &valkeyProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6379
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *valkeyProbe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6379
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
        pod:
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                        - key: app.kubernetes.io/name
                          operator: In
                          values: ["immich"]
                    topologyKey: kubernetes.io/hostname
                  weight: 100
    persistence:
      certs:
        type: secret
        name: immich-valkey-tls
      config:
        type: secret
        name: immich-valkey
    service:
      valkey:
        controller: valkey
        ports:
          http:
            port: 6379
