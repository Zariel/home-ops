---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchstate
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: watchstate
  template:
    metadata:
      labels:
        # plex.tv issues the per-user Plex tokens WatchState writes with.
        cbannister.xyz/egress: internet
        # WatchState exchanges OIDC codes with Pocket ID at id.cbannister.xyz.
        cbannister.xyz/egress-internal-gateway: "true"
        cbannister.xyz/ingress: internal-gateway
        app.kubernetes.io/name: watchstate
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # WatchState reads OIDC settings only from /config/config/config.yaml,
        # and nothing else writes that file, so this container owns it.
        - name: oidc-config
          image: &image ghcr.io/arabcoders/watchstate:v1.11.0@sha256:8d70d906f7cc30b35187072db6593b5205758fea77506e2bc3be47ae02bcbf5b
          command: [/bin/sh, -ec]
          args:
            - |
              mkdir -p /config/config
              umask 077
              cat > /config/config/config.yaml <<YAML
              auth:
                oidc:
                  issuer: '$OIDC_ISSUER'
                  client_id: '$OIDC_CLIENT_ID'
                  client_secret: '$OIDC_CLIENT_SECRET'
                  redirect_uri: 'https://watchstate.cbannister.xyz/v1/api/system/auth/oidc/callback'
              YAML
          env:
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: watchstate-oidc
                  key: issuer_url
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: watchstate-oidc
                  key: client_id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: watchstate-oidc
                  key: client-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: app
          image: *image
          env:
            - name: WS_TZ
              value: Europe/London
            - name: TZ
              value: Europe/London
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            tcpSocket: &probe
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: *probe
            periodSeconds: 10
          livenessProbe:
            tcpSocket: *probe
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: watchstate
