---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchstate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: watchstate
  template:
    metadata:
      labels:
        # plex.tv issues the per-user Plex tokens WatchState writes with.
        cbannister.xyz/egress: internet
        cbannister.xyz/ingress: internal-gateway
        app.kubernetes.io/name: watchstate
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/arabcoders/watchstate:v1.11.0@sha256:8d70d906f7cc30b35187072db6593b5205758fea77506e2bc3be47ae02bcbf5b
          env:
            - name: WS_TZ
              value: Europe/London
            - name: TZ
              value: Europe/London
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            tcpSocket: &probe
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: *probe
            periodSeconds: 10
          livenessProbe:
            tcpSocket: *probe
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: watchstate
