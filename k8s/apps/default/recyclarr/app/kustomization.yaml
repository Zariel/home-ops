# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - pvc.yaml
  - externalsecret.yaml
configMapGenerator:
  - name: recyclarr-includes
    files:
      - sonarr.yaml=config/sonarr.yaml
      - radarr.yaml=config/radarr.yaml
  - name: recyclarr-settings
    files:
      - settings.yml=config/settings.yml
  - name: recyclarr-radarr-custom-formats
    files:
      - config/custom-formats/radarr/hybrid-except-wildcat.json
generatorOptions:
  disableNameSuffixHash: true
