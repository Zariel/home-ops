---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/resource.k8s.io/resourceclaim_v1.json
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: transcode-gpu
  namespace: default
spec:
  # Consumers share this allocation and must run on its selected node.
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.intel.com
          count: 1
