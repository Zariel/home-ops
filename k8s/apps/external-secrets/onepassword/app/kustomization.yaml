# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-secrets
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
secretGenerator:
  - name: onepassword-connect-secret
    files:
      - onepassword-credentials.json=config/onepassword-credentials.sops.json
      - token=config/token.sops.txt
generatorOptions:
  disableNameSuffixHash: true
