---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rbmusic
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rbmusic
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: internal
      ports:
        - port: 8080
          protocol: TCP
  egress: []
