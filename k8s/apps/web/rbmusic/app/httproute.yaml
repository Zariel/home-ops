---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rbmusic
spec:
  hostnames:
    - www.rociobolanos.com
  parentRefs:
    - name: external-rociobolanos-com
      namespace: network
      kind: ListenerSet
      sectionName: https
  rules:
    - backendRefs:
        - name: rbmusic
          port: 80
