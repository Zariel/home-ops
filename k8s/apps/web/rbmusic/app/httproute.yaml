---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rbmusic
spec:
  hostnames:
    - music.rociobolanos.com
  parentRefs:
    - name: internal-rociobolanos-com
      namespace: network
      kind: ListenerSet
      sectionName: https
  rules:
    - backendRefs:
        - name: rbmusic
          port: 80
