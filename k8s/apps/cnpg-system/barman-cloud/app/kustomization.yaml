---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # renovate: datasource=github-releases depName=cloudnative-pg/plugin-barman-cloud
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.16.0/manifest.yaml
patches:
  - target:
      kind: Deployment
      name: barman-cloud
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: barman-cloud
      spec:
        template:
          spec:
            containers:
              - name: barman-cloud
                env:
                  - name: TZ
                    value: Europe/London
