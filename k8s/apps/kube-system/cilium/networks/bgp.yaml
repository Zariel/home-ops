---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: main-pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: 10.45.0.0/24
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumbgpclusterconfig_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: k8s-0
  bgpInstances:
    - name: upstream
      localASN: 65100
      peers:
        - name: default-gateway
          peerASN: 65001
          peerAddress: "10.254.1.0"
          peerConfigRef:
            name: upstream

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumbgpclusterconfig_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp-k8s-1
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: k8s-1
  bgpInstances:
    - name: upstream
      localASN: 65100
      peers:
        - name: default-gateway
          peerASN: 65001
          peerAddress: "10.254.1.2"
          peerConfigRef:
            name: upstream
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumbgpclusterconfig_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp-k8s-2
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: k8s-2
  bgpInstances:
    - name: upstream
      localASN: 65100
      peers:
        - name: default-gateway
          peerASN: 65001
          peerAddress: "10.254.1.4"
          peerConfigRef:
            name: upstream
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumbgppeerconfig_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: upstream
spec:
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: "bgp"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumbgpadvertisement_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-advertisements
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - key: thisFakeSelector
            operator: NotIn
            values: ["will-match-and-announce-all-services"]
    - advertisementType: PodCIDR
