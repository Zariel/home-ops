# yaml-language-server: $schema=null
bandwidthManager:
  enabled: true
  bbr: true
bgpControlPlane:
  enabled: true
bpf:
  datapathMode: netkit
  preallocateMaps: true
  hostLegacyRouting: false
  vlanBypass: [20, 40, 300]
bpfClockProbe: true
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
cluster:
  id: 1
  name: hollywoo
cni:
  exclusive: false
devices: "bond0"
enableIPv4Masquerade: false
endpointRoutes:
  enabled: true
envoy:
  enabled: false
ipam:
  mode: kubernetes
ipv4NativeRoutingCIDR: 0.0.0.0/0
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445
kubeProxyReplacement: true
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
loadBalancer:
  algorithm: maglev
  mode: dsr
  dsrDispatch: geneve
  acceleration: best-effort
operator:
  rollOutPods: true
pmtuDiscovery:
  enabled: true
resources:
  requests:
    cpu: 1500m
    memory: 1Gi
  limits:
    cpu: 1500m
    memory: 2Gi
rollOutCiliumPods: true
routingMode: native
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - PERFMON
      - BPF
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
      - PERFMON
      - BPF
tunnelProtocol: geneve

# Katl owns /etc/sysctl.d in its immutable host generation.
sysctlfix:
  enabled: false
