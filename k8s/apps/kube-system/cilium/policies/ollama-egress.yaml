---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ollama-egress
spec:
  description: >-
    Ollama on ash.cbannister.casa for workloads labelled
    cbannister.xyz/egress-ollama. The allowance is additive: the workload's own
    policy decides whether egress is otherwise restricted.
  endpointSelector:
    matchLabels:
      cbannister.xyz/egress-ollama: "true"
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toCIDR:
        - 10.1.1.55/32
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
