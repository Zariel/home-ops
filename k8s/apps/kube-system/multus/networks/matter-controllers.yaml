---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
# Matter controllers; IPv6-only. Pods supply their own allocated address via ips.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: matter-controllers
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "matter-controllers",
      "plugins": [
        {
          "type": "macvlan",
          "master": "bond0.1101",
          "mode": "bridge",
          "mtu": 1500,
          "capabilities": {
            "ips": true,
            "mac": true
          },
          "ipam": {
            "type": "static",
            "routes": [
              {
                "dst": "::/0",
                "gw": "fd74:f571:d3bd:1061::1"
              }
            ]
          }
        }
      ]
    }
