---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
# OTBR infrastructure; IPv6-only. Pods supply their own allocated address via ips.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: thread-infra
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "thread-infra",
      "plugins": [
        {
          "type": "macvlan",
          "master": "bond0.1100",
          "mode": "bridge",
          "mtu": 1500,
          "capabilities": {
            "ips": true,
            "mac": true
          },
          "ipam": {
            "type": "static",
            "routes": [
              {
                "dst": "::/0",
                "gw": "fd74:f571:d3bd:1060::1"
              }
            ]
          }
        }
      ]
    }
