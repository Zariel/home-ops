---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns
spec:
  enableDefaultDeny:
    ingress: true
    egress: true
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9153"
              protocol: TCP
    # Liveness and readiness probes.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8181"
              protocol: TCP
  egress:
    # The kubernetes plugin watches Services, EndpointSlices and pods.
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Forwarders from the Corefile: 10.45.0.55, the bind LoadBalancer, resolves
    # to the BIND pods; everything else goes to the resolver VIP.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app: bind
      toPorts: &dns
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDR:
        - 10.254.253.53/32
      toPorts: *dns
