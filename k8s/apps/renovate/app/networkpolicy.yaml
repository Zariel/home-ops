---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: renovate
  namespace: renovate
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
    # Internal HTTP(S) uses Envoy's pod ports after service translation.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: internal
      ports:
        - port: 10080
          protocol: TCP
        - port: 10443
          protocol: TCP
