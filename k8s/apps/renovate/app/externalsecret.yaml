---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
  namespace: renovate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  data:
    - secretKey: private-key
      remoteRef:
        key: renovate
        property: GITHUB_BOT_PRIVATE_KEY
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: renovate-github-token
  namespace: renovate
spec:
  appID: "869136"
  installID: "49294101"
  repositories:
    - home-ops
  auth:
    privateKey:
      secretRef:
        name: renovate-github-app
        key: private-key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-token
  namespace: renovate
spec:
  # Installation tokens last one hour; leave at least 45 minutes for each Job.
  refreshInterval: 15m
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: renovate-github-token
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-forgejo-token
  namespace: renovate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  data:
    - secretKey: token
      remoteRef:
        key: renovate
        property: FOREJO_TOKEN
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-registry-auth
  namespace: renovate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        RENOVATE_HOST_RULES: |
          [{
            "hostType": "docker",
            "matchHost": "https://git.cbannister.xyz/",
            "allowInternal": true,
            "username": {{ .USERNAME | toJson }},
            "password": {{ .IMAGE_PULL_SECRET | toJson }}
          }]
  dataFrom:
    - extract:
        key: forgejo-image-pull
