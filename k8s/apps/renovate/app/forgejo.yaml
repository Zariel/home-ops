---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-forgejo
  namespace: renovate
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: renovate
  valuesFrom:
    - kind: ConfigMap
      name: renovate-values
  values:
    fullnameOverride: renovate-forgejo
    renovate:
      config: |
        {
          "platform": "forgejo",
          "endpoint": "https://git.cbannister.xyz/api/v1/",
          "autodiscover": true,
          "onboardingConfig": {"extends": ["config:recommended"]},
          "hostRules": [
            {"matchHost": "https://git.cbannister.xyz/", "allowInternal": true},
            {"matchHost": "https://registry.cbannister.xyz/", "allowInternal": true}
          ]
        }
    envList:
      - name: RENOVATE_TOKEN
        valueFrom:
          secretKeyRef:
            name: renovate-forgejo-token
            key: token
      - name: RENOVATE_GITHUB_COM_TOKEN
        valueFrom:
          secretKeyRef:
            name: renovate-github-token
            key: token
