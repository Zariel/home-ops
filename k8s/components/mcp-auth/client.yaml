---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: ${APP}
spec:
  name: ${MCP_DISPLAY_NAME}
  clientID: ${APP}
  instanceSelector:
    matchLabels:
      pocketid.internal/instance: pocket-id
  isPublic: true
  pkceEnabled: true
  # Agent loopback callbacks: Codex uses 127.0.0.1 and Claude Code localhost.
  callbackUrls:
    - http://127.0.0.1:4321/callback
    - http://localhost:4321/callback
  allowedUserGroups:
    - groupName: admin
  accessTokenDurationMinutes: 15
  apiAccess:
    - apiRef:
        name: ${APP}
      delegatedPermissions:
        - ${MCP_SCOPE}
  secret:
    enabled: false
  logo:
    autoGenerate: false
