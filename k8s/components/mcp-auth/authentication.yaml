---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${APP}
  jwt:
    providers:
      - name: pocket-id
        issuer: https://id.cbannister.xyz
        audiences:
          - https://${APP}.cbannister.xyz/mcp
        remoteJWKS:
          uri: https://id.cbannister.xyz/.well-known/jwks.json
        extractFrom:
          headers:
            - name: Authorization
              valuePrefix: "Bearer "
  authorization:
    defaultAction: Deny
    rules:
      - name: mcp-access
        action: Allow
        principal:
          jwt:
            provider: pocket-id
            scopes:
              - ${MCP_SCOPE}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: ${APP}
spec:
  # Preserve the gateway's streaming timeout and connection settings.
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${APP}
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 401
      source: Local
      response:
        contentType: application/json
        body:
          type: Inline
          inline: '{"error":"unauthorized"}'
        header:
          set:
            - name: WWW-Authenticate
              value: 'Bearer resource_metadata="https://${APP}.cbannister.xyz/.well-known/oauth-protected-resource/mcp", scope="openid ${MCP_SCOPE}"'
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # The SecurityPolicy and BackendTrafficPolicy above target this route by name.
  name: ${APP}
spec:
  hostnames:
    - ${APP}.cbannister.xyz
  parentRefs:
    - name: internal-cbannister-xyz
      namespace: network
      kind: ListenerSet
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
      filters:
        # Backends trust their own credentials; drop the caller's token and any
        # headers that would let a caller override them (mcp-grafana reads X-Grafana-*).
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Authorization
              - X-Grafana-Service-Account-Token
              - X-Grafana-API-Key
              - X-Grafana-Org-Id
              - X-Grafana-URL
      backendRefs:
        - name: ${APP}
          port: 80
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}-discovery
spec:
  hostnames:
    - ${APP}.cbannister.xyz
  parentRefs:
    - name: internal-cbannister-xyz
      namespace: network
      kind: ListenerSet
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: ${APP}-discovery
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/httproutefilter_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: ${APP}-discovery
spec:
  directResponse:
    contentType: application/json
    body:
      type: Inline
      inline: |
        {
          "resource": "https://${APP}.cbannister.xyz/mcp",
          "authorization_servers": ["https://id.cbannister.xyz"],
          "scopes_supported": ["openid", "${MCP_SCOPE}", "offline_access"],
          "bearer_methods_supported": ["header"],
          "resource_name": "${MCP_DISPLAY_NAME}"
        }
