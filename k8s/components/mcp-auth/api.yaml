---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidapi_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDAPI
metadata:
  name: ${APP}
spec:
  name: ${MCP_DISPLAY_NAME}
  resource: https://${APP}.cbannister.xyz/mcp
  instanceSelector:
    matchLabels:
      pocketid.internal/instance: pocket-id
  permissions:
    - key: ${MCP_SCOPE}
      name: ${MCP_DISPLAY_NAME}
      description: Access ${MCP_DISPLAY_NAME} through MCP.
