---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ${APP}-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ${APP}
      app.kubernetes.io/instance: ${APP}
  ingress:
    # Only the internal gateway, which validates tokens, and node probes may
    # reach the backend; other workloads would bypass authentication.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: internal
            gateway.envoyproxy.io/owning-gateway-namespace: network
      toPorts: &http
        - ports:
            - port: http
              protocol: TCP
    - fromEntities:
        - host
      toPorts: *http
