---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-gateway
spec:
  length: 64
  allowRepeat: true
  symbols: 0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-gateway
spec:
  # The gateway and the backend read the same value; rotating it would reject
  # requests until the backend restarts.
  refreshPolicy: CreatedOnce
  target:
    name: ${APP}-gateway-credential
    template:
      data:
        # Envoy injects `credential` verbatim; the backend compares `token`.
        credential: "Bearer {{ .password }}"
        token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-gateway
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/httproutefilter_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: ${APP}-credential
spec:
  # Runs after JWT validation and authorization, replacing the caller's token.
  credentialInjection:
    overwrite: true
    credential:
      valueRef:
        kind: Secret
        name: ${APP}-gateway-credential
