# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system

# Install Cilium via Helm chart using production values
helmCharts:
  - name: cilium
    repo: oci://quay.io/cilium/charts
    version: 1.20.4
    releaseName: cilium
    namespace: kube-system
    valuesFile: ../../apps/kube-system/cilium/app/values.yaml

# Cilium BGP + LoadBalancer resources are applied separately after CRDs exist
