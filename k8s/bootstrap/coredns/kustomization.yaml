# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system

# Install CoreDNS via Helm chart using production values
helmCharts:
  - name: coredns
    repo: oci://ghcr.io/coredns/charts
    version: 1.50.5
    releaseName: coredns
    namespace: kube-system
    valuesFile: ../../apps/kube-system/coredns/app/values.yaml
